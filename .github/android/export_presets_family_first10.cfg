; M47-FAMILY-APK-C001 — Android Family "first 10 levels" DEBUG/DEVELOPMENT preset template.
; Copied to export_presets.cfg (gitignored) by .github/workflows/android-family-first10.yml;
; @VERSION_CODE@ / @VERSION_NAME@ come from data/config/app_version.json (SB-M59, docs/RELEASE_BUILDS.md);
; @PACKAGE@ / @APP_LABEL@ from the build_type. debug: debug keystore from GitHub Secrets (generated
; in CI if absent); release: release keystore secrets only. No keystore is ever committed.
; exclude_filter mirrors .github/android/family_first10_export_exclusions.txt (the export
; workspace also does not contain those trees at all).

[preset.0]

name="Android Family First10"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="addons/game_feel_flow/LICENSE, addons/saltmire_spark/LICENSE.txt"
exclude_filter="coordination/*, docs/*, tests/*, tools/*, level_factory/*, content_pipeline/*, assets/art/references/*, assets/ui/candidates/*, assets/ui/generated/*, addons/godot_ai/*, .github/*"
export_path="build/android/debug/ScrubBots-Android-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=@VERSION_CODE@
version/name="@VERSION_NAME@"
package/unique_name="@PACKAGE@"
package/name="@APP_LABEL@"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://assets/ui/final/branding/app_icon_master.png"
launcher_icons/adaptive_foreground_432x432="res://assets/ui/final/branding/app_icon_android_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/ui/final/branding/app_icon_android_background.png"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
permissions/post_notifications=true
permissions/vibrate=true
