name: One-shot M24 V02 tracker handoff

on:
  push:
    paths:
      - '.github/workflows/one_shot_m24_v02_handoff.yml'

permissions:
  contents: write

jobs:
  update-tracker:
    if: "${{ github.event.head_commit.message == 'chore: run M24 V02 tracker handoff' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update TASKS handoff
        run: python tools/one_shot_m24_v02_handoff.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -q -- '- Current Milestone: M24' TASKS.md
          grep -q -- '- Current Task: M24-C001-V02' TASKS.md
          grep -q -- '- Current Task Status: CHANGES_REQUIRED' TASKS.md
          test "$(grep -c '^- \[ \] SB-M24-' TASKS.md)" -eq 30
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: move M24-C001 to V02 changes required"
          git push origin main
