name: Root TASKS single-tracker reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-tasks-contract-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile owner-locked tracker contract and M19 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # ---------- root TASKS.md: sole live tracker + M19 closure ----------
          t = read('TASKS.md')

          status = '''## Project Status

          - Current Milestone: M20
          - Current Sprint: M20-C001 PREP — Complete Clearing Vertical Slice strict-v2 full-surface audit/prompt issuance
          - Current Task: M20-C001-PREP — ChatGPT inspects the current M20 integration surface and freezes the implementation/audit contract before Claude implementation
          - Current Task Status: READY_FOR_NEXT_TASK
          - Next Task/Action: ChatGPT independently inspects the current M20 integration surface, performs the full attack-surface sweep required by coordination/AUDIT_POLICY.md, then issues the canonical M20-C001 V01 prompt and audit criteria. Claude must not implement M20 before that prompt exists.
          - Required Actor: CHATGPT
          - Tracking Repository: Sekiph82/Scrubbots
          - Tracking Branch: main
          - Progress: 290 / 719 = 40.33% (main+ui); overall 290 / 943 = 30.75%; lastCompletedTaskId M19-C001-V06.
          - Note: M19-C001 V06 AUDITED_PASS / STRICT_V2_FINAL_CLOSURE. Final audit: coordination/sessions/M19-C001/CHATGPT_AUDIT_V06.md. V06 validation commit 77d5359c4482a816e3d2e2ca7481ec1fdb7ed8af; 3273/3273 Godot 4.7.1; V05 dispatcher production blob unchanged at 0d1a6b1f6e9a6f1788ceb2078473c87bec8986e3.

          ## Tasks
          '''
          t, n = re.subn(r'## Project Status\n.*?\n## Tasks\n', status, t, count=1, flags=re.S)
          assert n == 1, 'Project Status block not uniquely replaced'

          new_notice = ('> **H!veAI tracking [OWNER-LOCKED — 2026-09-10]:** repository-root '
                        '`TASKS.md` is the one and only live project-status tracker. The top '
                        '`Project Status` block controls current milestone, sprint, task, actor, '
                        'next action, workflow status, and progress. Former `.hiveai` control-plane '
                        'files are archived under `docs/migration/legacy-task-trackers/` and are '
                        'historical evidence only. Never recreate or synchronize a competing live tracker.')
          t, n = re.subn(r'> \*\*H!veAI notice \(GitHub-first v3\):\*\*.*?(?=\n\nPermanent master execution roadmap)',
                         new_notice, t, count=1, flags=re.S)
          assert n == 1, 'stale embedded H!veAI notice not uniquely replaced'

          # Canonical root filename is uppercase.
          t = t.replace('`tasks.md`', '`TASKS.md`')

          # Global checkbox replacement because M19-011 and M19-012 share one line.
          for i in range(1, 13):
              task_id = f'SB-M19-{i:03d}'
              old = f'[ ] {task_id}'
              new = f'[x] {task_id}'
              assert t.count(old) == 1, f'{task_id} expected exactly once open'
              t = t.replace(old, new, 1)

          heading = '### M19 — Scrubbot Dispatcher\n'
          closure_note = ('\n**Strict-v2 final closure:** M19-C001 V06 '
                          '`AUDITED_PASS / STRICT_V2_FINAL_CLOSURE`. Final audit: '
                          '`coordination/sessions/M19-C001/CHATGPT_AUDIT_V06.md`. '
                          'Validation-only commit `77d5359`; `3273/3273` on Godot 4.7.1; '
                          'V05 dispatcher production blob unchanged.\n')
          assert heading in t, 'M19 heading missing'
          if closure_note.strip() not in t:
              t = t.replace(heading, heading + closure_note, 1)

          # M20 remains untouched/open.
          m20 = list(re.finditer(r'\[([ xX])\]\s+(SB-M20-\d+)', t))
          assert m20, 'M20 task rows not found'
          assert all(m.group(1) == ' ' for m in m20), 'an M20 task was unexpectedly closed'
          write('TASKS.md', t)

          # ---------- AGENTS.md: one unambiguous rule ----------
          write('AGENTS.md', '''# ScrubBots Agent Instructions

          ## H!veAI GitHub tracking [OWNER-LOCKED — 2026-09-10]

          - GitHub `origin/main` is repository/project-state authority.
          - Repository-root `TASKS.md` is the **only live project-status tracker** consumed by H!veAI.
          - Read root `TASKS.md` before project work and obey its top `Project Status` block.
          - When an active ChatGPT prompt authorizes a lifecycle transition, update root `TASKS.md` and push it in the evidence chain that describes that state.
          - Former `.hiveai/PROJECT.json`, `.hiveai/RULES.md`, `.hiveai/TASKS.md`, `.hiveai/EVENTS.jsonl`, dashboards, cycle maps and snapshots are retired as live control-plane state. Archived copies under `docs/migration/legacy-task-trackers/` are historical evidence only.
          - Do **not** create, revive, synchronize, or maintain any competing `.hiveai` tracker.
          - Coordination prompts/logs/audits are evidence artifacts, not competing current-state trackers.
          - Independent audit separation remains locked: Claude implements/tests and may hand off `AWAITING_AUDIT`; only ChatGPT audit may assign `AUDITED_*` and close audit-owned task truth.
          - Provider-specific behavior must not change these tracking semantics.
          ''')

          # ---------- CLAUDE.md: preserve engineering manual, remove tracker contradictions ----------
          c = read('CLAUDE.md')
          top = '''# H!veAI GitHub tracking [OWNER-LOCKED — 2026-09-10]

          - GitHub `origin/main` is repository/project-state authority.
          - Repository-root `TASKS.md` is the **only live H!veAI project-status tracker**.
          - Read root `TASKS.md` first for current milestone, sprint, task, workflow status, required actor, next action and progress.
          - Update root `TASKS.md` only when the active prompt authorizes a truthful lifecycle handoff; commit/push that state with the evidence it describes.
          - Never create or revive `.hiveai/*` as live control-plane state. Archived former tracker files under `docs/migration/legacy-task-trackers/` are historical only.
          - Coordination prompt/log/audit files are evidence, not current-state trackers.
          - Claude never self-audits or marks audit-owned completion; ChatGPT remains the independent auditor.

          **This owner-locked block supersedes any historical tracker/dashboard/session-index wording below.**

          ---

          # SCRUBBOTS — Project Operating Manual for AI Agents
          '''
          c, n = re.subn(r'^# H!veAI GitHub-first adapter \(v3\).*?---\n\n# SCRUBBOTS — Project Operating Manual for AI Agents\n',
                         top, c, count=1, flags=re.S)
          assert n == 1, 'CLAUDE top adapter not replaced'
          c = c.replace('`tasks.md`', '`TASKS.md`')

          replacement5 = '''## 5. H!veAI tracking contract

          36. Repository-root `TASKS.md` is the single live H!veAI project-status contract. Former `.hiveai` trackers/dashboards and `coordination/SESSION_INDEX.md` are historical evidence only and must not be maintained as parallel current state. The top `Project Status` block in `TASKS.md` controls current task/actor/progress.

          ## 6. Working style
          '''
          c, n = re.subn(r'## 5\. H!veAI dashboard contract\n.*?## 6\. Working style\n', replacement5, c, count=1, flags=re.S)
          assert n == 1, 'CLAUDE section 5 not replaced'

          c = re.sub(r'37\. Before any material implementation session, read in this order after\n\s+reading this file:.*?version order, followed by the relevant `docs/` sources\.',
                     '''37. Before any material implementation session, read in this order after
              reading this file: root `TASKS.md`, `coordination/README.md`,
              `coordination/AUDIT_POLICY.md`, `coordination/AUDIT_INDEX.md`, then every
              prompt/audit/owner-note artifact in the active coordination cycle in
              version order, followed by the relevant `docs/` sources.''',
                     c, count=1, flags=re.S)

          # Replace the late duplicate H!veAI tracking block created by the migration.
          c = re.sub(r'\n## H!veAI GitHub tracking\n\n(?:- .*\n)+',
                     '''\n## H!veAI GitHub tracking\n\n- Root `TASKS.md` is the only current project-status tracker.\n- Keep its `Project Status` truthful when the active prompt authorizes a lifecycle transition.\n- Do not create or revive `.hiveai/*` tracker files, dashboards, maps or event logs as live state.\n- Archived tracker material under `docs/migration/legacy-task-trackers/` is read-only historical evidence.\n''',
                     c)
          write('CLAUDE.md', c)

          # ---------- coordination/README.md: current protocol only ----------
          write('coordination/README.md', '''# SCRUBBOTS Coordination Protocol

          ## Authority model [OWNER-LOCKED — 2026-09-10]

          - GitHub `origin/main` is repository truth.
          - Root `TASKS.md` is the **only live project-status tracker** and the only H!veAI current-state surface.
          - `CLAUDE.md` and `AGENTS.md` are operating/governance manuals, not status trackers.
          - `coordination/AUDIT_POLICY.md` is the audit constitution.
          - `coordination/AUDIT_INDEX.md` is ChatGPT-owned reusable audit memory.
          - `coordination/sessions/<CYCLE_ID>/` contains versioned evidence artifacts.
          - Former `.hiveai/*`, dashboards, ACTIVE_CYCLES, ARTIFACT_MAP, PROGRESS_SNAPSHOT and `coordination/SESSION_INDEX.md` are historical only. Do not maintain them as live state.

          ## Versioned cycle bundle

          ```text
          CHATGPT_PROMPT_VNN.md
          CHATGPT_AUDIT_CRITERIA_VNN.md
          CLAUDE_LOG_VNN.md
          CHATGPT_AUDIT_VNN.md
          ```

          ChatGPT owns the `CHATGPT_*` artifacts. Claude owns only the matching `CLAUDE_LOG_VNN.md`. Claude never creates an audit verdict or edits a ChatGPT audit artifact.

          ## Normal cycle flow

          1. ChatGPT reads root `TASKS.md`, current source, prior audits and `AUDIT_INDEX.md`.
          2. For critical work ChatGPT performs the required full attack-surface sweep, freezes findings, and publishes prompt/criteria.
          3. Claude safely syncs `origin/main`, confirms root `TASKS.md` authorizes Claude, then implements/tests.
          4. When the prompt requires lifecycle tracking, Claude updates root `TASKS.md` to `IN_PROGRESS` before material edits, commits/pushes it, and later hands off as `AWAITING_AUDIT` with the matching log/evidence.
          5. Claude stops. It does not self-audit and does not mark audit-owned task rows complete.
          6. ChatGPT independently audits GitHub state. For corrections ChatGPT sets the next `CHANGES_REQUIRED` task/version in root `TASKS.md`; for final PASS ChatGPT closes approved task rows, updates progress and sets the next frontier in root `TASKS.md`.

          ## Single-tracker rule

          There is no second live tracker. Do not mirror current task, actor, progress or next action into `.hiveai/*`, dashboards, session indexes or coordination summary files. Explicit archive/history paths may preserve old snapshots as evidence only.

          ## Evidence and strict audit

          Claude runtime checks are E1/E2 implementer evidence. ChatGPT source/diff/test inspection is E3 audit evidence. Owner-controlled decisions are E4. Only ChatGPT audit files may assign audit verdicts. `coordination/AUDIT_POLICY.md` governs strict-v2 closure, full-surface sweeps, adversarial validation, direct observability and sensitivity.

          Canonical repository: `https://github.com/Sekiph82/Scrubbots`  
          Canonical live tracker: `https://github.com/Sekiph82/Scrubbots/blob/main/TASKS.md`
          ''')

          # ---------- VERSIONED_LOG_POLICY.md: remove retired derived trackers ----------
          write('coordination/VERSIONED_LOG_POLICY.md', '''# SCRUBBOTS Versioned Claude Log Policy

          Status: LOCKED
          Coordination schema: scrubbots-coordination/v4

          ## Canonical bundle

          Every ChatGPT prompt version has one matching Claude evidence file in the same cycle:

          ```text
          CHATGPT_PROMPT_VNN.md
          CHATGPT_AUDIT_CRITERIA_VNN.md
          CLAUDE_LOG_VNN.md
          CHATGPT_AUDIT_VNN.md
          ```

          Prompt/log version matching is mandatory.

          ## Ownership

          - ChatGPT owns `CHATGPT_PROMPT_VNN.md`, `CHATGPT_AUDIT_CRITERIA_VNN.md`, and `CHATGPT_AUDIT_VNN.md`.
          - Claude owns `CLAUDE_LOG_VNN.md` only.
          - Claude never creates/edits ChatGPT artifacts or assigns an audit verdict.
          - ChatGPT never fabricates Claude logs.

          ## Root TASKS tracking [OWNER-LOCKED — 2026-09-10]

          Root `TASKS.md` is the only live project-status tracker and H!veAI current-state surface. Former `.hiveai/*`, dashboard, cycle-map, progress-snapshot and session-index trackers are retired historical evidence. Do not create or synchronize a competing tracker.

          Claude may update root `TASKS.md` only as authorized by the active prompt for truthful lifecycle handoff (`IN_PROGRESS`, `AWAITING_AUDIT`, or truthful `BLOCKED`). Claude must not mark independent-audit completion or close audit-owned task rows. ChatGPT performs independent audit closure, task-row closure, progress update and next-frontier update in root `TASKS.md`.

          ## Claude log requirements

          `CLAUDE_LOG_VNN.md` records prompt/criteria/prior-audit references, starting commit, changed files, exact validation commands/results, failures/fixes, scope/governance checks, commit/push evidence, blockers and final handoff. Aggregate green totals never substitute for individually mandated checks.

          ## GitHub-only evidence

          For M12-C001 and later work, durable handoff evidence lives in GitHub. Historical Desktop logs are not a required live coordination surface.

          ## Non-self-referential final SHA rule

          A Git-tracked Claude log must not be edited merely to insert the SHA of the commit containing that same log. ChatGPT verifies final remote state directly.

          ## Strict-v2 adversarial validation

          Critical milestones may use later validation-heavy prompt versions. Final closure remains ChatGPT-owned under `coordination/AUDIT_POLICY.md`.

          ## Progress reporting

          Progress is recalculated from canonical root `TASKS.md`, never from archived `.hiveai` files or deprecated dashboards.
          ''')

          # ---------- AUDIT_POLICY.md: preserve strict body, add sole-tracker override ----------
          ap = read('coordination/AUDIT_POLICY.md')
          anchor = 'Canonical repository: https://github.com/Sekiph82/Scrubbots\n'
          override = '''\n## Tracking authority override [OWNER-LOCKED — 2026-09-10]\n\nRoot `TASKS.md` is the only live project-status tracker and H!veAI current-state surface. Former `.hiveai/*` trackers/dashboards and `coordination/SESSION_INDEX.md` are retired as live authority and may exist only as historical evidence. Any older tracking sentence below is superseded by this section. Claude may perform prompt-authorized lifecycle handoffs in root `TASKS.md`; ChatGPT owns independent audit verdicts, audit task closure, final progress updates and next-frontier advancement.\n'''
          assert anchor in ap
          if '## Tracking authority override [OWNER-LOCKED — 2026-09-10]' not in ap:
              ap = ap.replace(anchor, anchor + override, 1)
          ap = ap.replace('update task/dashboard/session state truthfully;', 'update root `TASKS.md` lifecycle state truthfully when the active prompt authorizes it;')
          ap = ap.replace('update `SESSION_INDEX.md` and the H!veAI dashboard.', 'update root `TASKS.md` with the independent audit result, approved task closure, progress, and next frontier.')
          ap = ap.replace('H!veAI derived tracking files are ACTIVE_CYCLES.md, ARTIFACT_MAP.md, and\nPROGRESS_SNAPSHOT.md under `.hiveai/`; they do not replace `tasks.md`.', 'Root `TASKS.md` is the sole live H!veAI/project-status tracker. Former `.hiveai` derived trackers and dashboards are retired historical evidence only.')
          ap = ap.replace('`tasks.md`', '`TASKS.md`')
          write('coordination/AUDIT_POLICY.md', ap)

          # ---------- migration archive README ----------
          write('docs/migration/legacy-task-trackers/README.md', '''# Legacy H!veAI tracker archive

          Repository: `Sekiph82/Scrubbots`  
          Branch: `main`

          These files are **historical evidence only**. They are snapshots of the retired `.hiveai` control-plane/tracker system and must never be read, updated, synchronized, copied back, or recreated as current project state.

          The one and only live project-status tracker is repository-root `TASKS.md`. Current milestone, sprint, task, workflow state, actor, next action and progress come from its top `Project Status` block.
          ''')

          # ---------- update M19 closure instruction to user's actual desired scope ----------
          write('coordination/sessions/M19-C001/CHATGPT_TRACKER_CLOSURE_V06.md', '''# M19-C001 — Owner-Directed Final Closure Materialization

          Authority: `coordination/sessions/M19-C001/CHATGPT_AUDIT_V06.md`  
          Audit verdict: **AUDITED_PASS / STRICT_V2_FINAL_CLOSURE**

          Status: **OWNER-DIRECTED CONTRACT EXPANSION — root TASKS.md is the sole live tracker**

          This is not another implementation/audit cycle. The owner explicitly requires repository-root `TASKS.md` to be the single live H!veAI/project-status tracker.

          Final closure therefore includes all necessary governance reconciliation:

          1. root `TASKS.md`: close SB-M19-001..012, set progress to 290/719 = 40.33% main+ui and 290/943 = 30.75% overall, set lastCompletedTaskId M19-C001-V06, and move the current frontier to M20-C001-PREP / READY_FOR_NEXT_TASK / actor CHATGPT;
          2. root `TASKS.md`: replace the embedded stale `.hiveai/TASKS.md` authority notice;
          3. `AGENTS.md` and `CLAUDE.md`: remove live `.hiveai` authority instructions and point current-state reads/writes only to root `TASKS.md`;
          4. `coordination/README.md`, `coordination/AUDIT_POLICY.md`, and `coordination/VERSIONED_LOG_POLICY.md`: remove dashboard/session-index/derived-tracker current-state ownership and make root `TASKS.md` the sole live tracker while preserving independent audit separation;
          5. `docs/migration/legacy-task-trackers/README.md`: mark archived tracker files historical/read-only;
          6. never recreate `.hiveai/*` as a competing tracker;
          7. do not modify gameplay production or tests for this administrative closure.

          M19 production remains locked to accepted V05 dispatcher blob `0d1a6b1f6e9a6f1788ceb2078473c87bec8986e3`; V06 evidence remains commit `77d5359c4482a816e3d2e2ca7481ec1fdb7ed8af` with 3273/3273 Godot 4.7.1 checks.

          Once these governance/tracker changes are on `origin/main`, this materialization is complete. Do not begin M20 implementation until ChatGPT performs the M20 full attack-surface sweep and publishes the canonical M20-C001 V01 prompt/criteria.
          ''')

          # ---------- assertions ----------
          t = read('TASKS.md')
          assert all(f'[x] SB-M19-{i:03d}' in t for i in range(1, 13))
          assert '290 / 719 = 40.33%' in t and '290 / 943 = 30.75%' in t
          assert 'Current Milestone: M20' in t and 'Current Task Status: READY_FOR_NEXT_TASK' in t
          assert 'Required Actor: CHATGPT' in t
          assert '.hiveai/TASKS.md` is the H!veAI authority' not in t
          assert all(m.group(1) == ' ' for m in re.finditer(r'\[([ xX])\]\s+(SB-M20-\d+)', t))
          assert 'Read `.hiveai/TASKS.md`' not in read('AGENTS.md')
          assert 'Read `.hiveai/TASKS.md`' not in read('CLAUDE.md')
          assert '.hiveai/PROJECT_DASHBOARD.md` is the single H!veAI-facing' not in read('coordination/README.md')
          assert 'H!veAI actively watches only .hiveai/PROJECT_DASHBOARD.md' not in read('coordination/VERSIONED_LOG_POLICY.md')
          print('Root TASKS single-tracker reconciliation validated.')
          PY

      - name: Verify diff is governance/tracker only
        shell: bash
        run: |
          git diff --check
          echo 'Changed files:'
          git diff --name-only
          if git diff --name-only | grep -E '^(scripts/|tests/)'; then
            echo 'ERROR: gameplay/test file changed' >&2
            exit 1
          fi

      - name: Commit and push reconciliation
        shell: bash
        run: |
          git config user.name 'ScrubBots Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md AGENTS.md CLAUDE.md coordination/README.md coordination/AUDIT_POLICY.md coordination/VERSIONED_LOG_POLICY.md coordination/sessions/M19-C001/CHATGPT_TRACKER_CLOSURE_V06.md docs/migration/legacy-task-trackers/README.md
          git commit -m 'governance: make root TASKS sole tracker and close M19'
          git push origin HEAD:main
