name: One-shot close M24 and open M25

on:
  push:
    paths:
      - '.github/workflows/one_shot_close_m24_open_m25.yml'

permissions:
  contents: write

jobs:
  update-tracker:
    if: "${{ github.event.head_commit.message == 'chore: run M24 closure and M25 handoff' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical tracker
        run: python tools/one_shot_close_m24_open_m25.py
      - name: Validate tracker state
        shell: bash
        run: |
          git diff --check
          grep -q -- '- Current Milestone: M25' TASKS.md
          grep -q -- '- Current Task: M25-C001-V01' TASKS.md
          grep -q -- '- Current Task Status: IN_PROGRESS' TASKS.md
          test "$(grep -c '^- \[x\] SB-M24-' TASKS.md)" -eq 30
          test "$(grep -c '^- \[ \] SB-M25-' TASKS.md)" -eq 32
      - name: Commit tracker
        shell: bash
        run: |
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: close M24 and open M25-C001 V01"
          git push origin main
