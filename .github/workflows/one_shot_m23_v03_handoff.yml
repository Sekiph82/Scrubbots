name: One-shot M23 V03 tracker handoff

on:
  push:
    paths:
      - '.github/workflows/one_shot_m23_v03_handoff.yml'

permissions:
  contents: write

jobs:
  update-tracker:
    if: "${{ github.event.head_commit.message == 'chore: run M23 V03 tracker handoff' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update TASKS handoff
        run: python tools/one_shot_m23_v03_handoff.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --short -- TASKS.md)"
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: move M23-C001 to V03 changes required"
          git push origin main
