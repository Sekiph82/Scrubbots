name: One-shot TASKS wording cleanup

on:
  push:
    paths:
      - '.github/workflows/one_shot_tasks_wording_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite TASKS wording
        run: python tools/one_shot_tasks_wording_cleanup.py
      - name: Commit TASKS
        run: |
          git diff --check
          test -n "$(git status --short -- TASKS.md)"
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: remove stale aligned-exit wording"
          git push origin main
