name: Finalize root TASKS single-tracker reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-tasks-contract-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute validated reconciliation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wf = Path('.github/workflows/root-tasks-contract-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          assert start_marker in wf and end_marker in wf
          body = wf.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'root-tasks-reconcile', 'exec'), {})

          # Normalize generated Markdown so git diff --check is clean.
          targets = [
              'TASKS.md',
              'AGENTS.md',
              'CLAUDE.md',
              'coordination/README.md',
              'coordination/AUDIT_POLICY.md',
              'coordination/VERSIONED_LOG_POLICY.md',
              'coordination/sessions/M19-C001/CHATGPT_TRACKER_CLOSURE_V06.md',
              'docs/migration/legacy-task-trackers/README.md',
          ]
          for name in targets:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify governance-only diff
        shell: bash
        run: |
          git diff --check
          echo 'Changed files:'
          git diff --name-only
          if git diff --name-only | grep -E '^(scripts/|tests/)'; then
            echo 'ERROR: gameplay/test file changed' >&2
            exit 1
          fi
          test "$(git diff --name-only | grep -c '^TASKS.md$')" -eq 1
          grep -q 'Current Milestone: M20' TASKS.md
          grep -q 'Current Task Status: READY_FOR_NEXT_TASK' TASKS.md
          grep -q 'Required Actor: CHATGPT' TASKS.md
          grep -q '290 / 719 = 40.33%' TASKS.md
          grep -q '290 / 943 = 30.75%' TASKS.md
          for i in $(seq -w 1 12); do grep -q "\[x\] SB-M19-0$i" TASKS.md; done
          if grep -q 'Read `.hiveai/TASKS.md`' AGENTS.md CLAUDE.md; then exit 1; fi

      - name: Commit and push owner-directed reconciliation
        shell: bash
        run: |
          git config user.name 'ScrubBots Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md AGENTS.md CLAUDE.md coordination/README.md coordination/AUDIT_POLICY.md coordination/VERSIONED_LOG_POLICY.md coordination/sessions/M19-C001/CHATGPT_TRACKER_CLOSURE_V06.md docs/migration/legacy-task-trackers/README.md
          git commit -m 'governance: make root TASKS sole tracker and close M19'
          git push origin HEAD:main
