name: One-shot close M23 and open M24

on:
  push:
    paths:
      - '.github/workflows/one_shot_close_m23_open_m24.yml'

permissions:
  contents: write

jobs:
  update-tracker:
    if: "${{ github.event.head_commit.message == 'chore: run M23 closure and M24 handoff' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical tracker
        run: python tools/one_shot_close_m23_open_m24.py
      - name: Validate tracker state
        shell: bash
        run: |
          git diff --check
          grep -q -- '- Current Milestone: M24' TASKS.md
          grep -q -- '- Current Task: M24-C001-V01' TASKS.md
          test "$(grep -c '^- \[x\] SB-M23-' TASKS.md)" -eq 30
          grep -q '^- \[ \] SB-M24-001' TASKS.md
      - name: Commit tracker
        shell: bash
        run: |
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: close M23 and open M24-C001 V01"
          git push origin main
