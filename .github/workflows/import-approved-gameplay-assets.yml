name: Import approved gameplay PNG assets

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-approved-gameplay-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download owner-approved generated assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui/final/gameplay/controls
          mkdir -p assets/ui/final/gameplay/railroad
          mkdir -p assets/ui/final/gameplay/master

          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/y34KfvGFYuwUYgKM' -o assets/ui/final/gameplay/controls/button_pause.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/VYcTFVgsL77wa23d' -o assets/ui/final/gameplay/controls/button_speed_2x.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/4SlahHmAFgasg4G0' -o assets/ui/final/gameplay/controls/button_speed_2x_active.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/DEeipPcG3Z4DMWvU' -o assets/ui/final/gameplay/controls/button_speed_2x_countdown_frame.png

          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/c9K86307NxzxmboD' -o assets/ui/final/gameplay/railroad/rail_straight_horizontal.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/t9CDg1MOkhwxiqjl' -o assets/ui/final/gameplay/railroad/rail_straight_vertical.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/EQDwG65yixy7SkvH' -o assets/ui/final/gameplay/railroad/rail_corner_90.png
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/mNpEyQfagpZWB5B7' -o assets/ui/final/gameplay/railroad/rail_slot_connector.png

          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/UjSxSQnnwZORP4fN' -o assets/ui/final/gameplay/master/scrubbots_gameplay_master.png

      - name: Validate PNG signatures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("assets/ui/final/gameplay/controls/button_pause.png"),
              Path("assets/ui/final/gameplay/controls/button_speed_2x.png"),
              Path("assets/ui/final/gameplay/controls/button_speed_2x_active.png"),
              Path("assets/ui/final/gameplay/controls/button_speed_2x_countdown_frame.png"),
              Path("assets/ui/final/gameplay/railroad/rail_straight_horizontal.png"),
              Path("assets/ui/final/gameplay/railroad/rail_straight_vertical.png"),
              Path("assets/ui/final/gameplay/railroad/rail_corner_90.png"),
              Path("assets/ui/final/gameplay/railroad/rail_slot_connector.png"),
              Path("assets/ui/final/gameplay/master/scrubbots_gameplay_master.png"),
          ]
          sig = b"\x89PNG\r\n\x1a\n"
          for p in files:
              data = p.read_bytes()
              if len(data) < 1024 or data[:8] != sig:
                  raise SystemExit(f"Not a valid PNG download: {p} ({len(data)} bytes)")
              print(f"VALID {p} {len(data)} bytes")
          PY

      - name: Commit assets and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-approved-gameplay-assets.yml
          git config user.name "scrubbots-asset-import"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ui/final/gameplay .github/workflows/import-approved-gameplay-assets.yml
          git commit -m "assets: add approved gameplay visual components"
          git push origin HEAD:main
