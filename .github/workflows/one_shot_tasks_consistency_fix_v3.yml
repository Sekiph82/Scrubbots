name: One-shot TASKS consistency fix v3

on:
  push:
    paths:
      - '.github/workflows/one_shot_tasks_consistency_fix_v3.yml'

permissions:
  contents: write

jobs:
  fix-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite TASKS
        run: python tools/one_shot_tasks_consistency_fix.py
      - name: Commit TASKS
        run: |
          git diff --check
          test -n "$(git status --short -- TASKS.md)"
          git config user.name "ChatGPT Tracker Owner"
          git config user.email "chatgpt-tracker@users.noreply.github.com"
          git add TASKS.md
          git commit -m "tracker: align Railroad and batch-input owner rules"
          git push origin main
