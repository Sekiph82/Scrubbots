# SB-M44-026 + 022..023 Featured Card schedule (135 cards), L20/L30/L40 milestone card once, L1 Collection onboarding / pity, data-driven Daily/Tasks/Events gates: + m44_featured_card_onboarding (exact 8/8 guard).
# SB-M57-012/013 + SB-M43-081/084 real-money store seam (null provider default, MockProvider grants once per token, No Ads, restore): + m57_store_products (exact 9/9 guard).
# SB-M44-027 Robots 5-stage assembly visual (50/100/150/200/250 Bot Parts, shader reveal of the next robot's portrait): + m44_robot_assembly_stages (exact 4/4 guard).
# SB-M57-001..011 ad seam (null provider default, interstitial every 4 finished plays from level 10 between levels (SB-TF-07), No Ads keeps rewarded, rewarded grants only on completion, saved play counter): + m57_ads_cadence (exact 6/6 guard).
# SB-M57-014..016 / 022 real Play Billing / StoreKit / AdMob providers (fake native backends; input billing_ads adds the plugins, also to aab_release): + m57_native_providers (exact guard).
# SB-TF-01 store error detail (STORE_ERROR / STORE_INVALID_IDS), bounded AdMob load retry, rewarded unavailable text; input
#   ads_test_mode (default true) = Google TEST ad units for every build, real ids from secrets only with
#   ads_test_mode=false + release: m57_native_providers guard now exact 14/14.
# SB-M43-152..157 / SB-M49-030 / SB-M54-031 cloud save seam (null provider default, mock provider: header round trip, conflict choice, no double grant, failures never touch the local save, conflict screen fit): + m54_cloud_save_seam (exact 7/7 guard).
# SB-M49-029 (mock part) ad / store return transitions (TEST-ONLY overlay providers: focus out/in, pause/resume, resize + safe-area change while up; completed / cancelled / failed; Shop buy + restore, Need a Hand, Continue interstitial, Rewarded Ads, Life): + m49_ad_store_return_layout (exact 6/6 guard).
# SB-PHONE-2026-11-12-D board background BG01 under the board rect, no board cell under the baked frame (L20/L30/59x59 at 720x1520, 1080x2400, 1170x2532): + board_bg01_backdrop (exact 4/4 guard).
# SB-PHONE-2026-11-12-E a win plays the level-complete animation, then Home by itself (no Results, Back skips, no level starts); receipt rewards fly into the Home HUD, ceremonies follow; LOST keeps Results; Reduced; interstitial only at Home PLAY: + sb_phone_2026_11_12_e_win_home (exact 9/9 guard).
# SB-HOME-FLIGHT-LOCK-2026-11-17 each reward shows "+N" then min(N, 5) staggered icons that step the HUD counter to its exact final value; Home ignores every tap and Back until the last arrival lands (no-receipt / empty / Reduced never lock): sb_phone_2026_11_12_e_win_home guard now exact 10/10.
# SB-TF-03 Home/Profile redesign: no bottom nav / Shop + Collection tiles / win-streak strip, Settings icon in the HUD, 320x50 banner area (No Ads collapses it), 0.7x see-through auto-hiding activity buttons (Rewarded Ads, Tasks, Daily, one per active Event), Profile Robots / Ranks / Collection, Settings Notifications, Hearts + MORE IN SHOP, PLAY · LEVEL N: + sb_tf03_home_profile (exact 11/11 guard).
# SB-TF-04 gameplay layout: Home banner area at the bottom (No Ads collapses it), boosters higher / bigger right of Scrubby, props x0.75 beside Supply, Scrubby x1.25, bubble behind slots + Supply with clear text, six regenerated masters, board floor tone; SB-TF-10 boosters centred under Supply, floor #0068D8: + sb_tf04_gameplay_layout (exact 7/7 guard).
# SB-TF-05 shared reward reveal (every source: appear together, 1.5 s hold, fly, one input lock; Reduced keeps the hold; card pack grows then the pack flow; win rewarded x2 Scrub Bucks once on a verified view): + sb_tf05_reward_reveal (exact 16/16 guard).
# SB-TF-06 Tornado booster video (owner clip additive from the Tornado button to the board centre on any viewport, purged cells spiral into it, spin-collapse + burst, no vector arms, Reduced = no video, code-only on a missing clip, identical purge result): + sb_tf06_tornado_video (exact 12/12 guard).
# SB-TF-07 ad placements (data/config/ad_placements_v1.json policy 2: interstitial every 4 plays from level 10, App Open from level 20 once per local day never on the install day and only after the opening, rewarded event +1 once per event per day, No Ads removes App Open + interstitial): + sb_tf07_ad_placements (exact 14/14 guard).
# SB-TF-08 Achievements open earned-first (claimable, claimed, in progress; catalogue order inside each group; no live re-sort on CLAIM), Collection READ ALL marks every owned unseen card seen in one durable facade save (badges clear, nothing else changes): + sb_tf08_achievements_readall (exact 12/12 guard).
# SB-TF-11 Daily login rewards on Profile's Login Days card (no Home Daily button / first-Home Daily tip; the card opens the existing ladder, claim once per day with the shared reveal, claimable badge on the card + Home profile card, streak kept across relaunch): + sb_tf11_login_days (exact 6/6 guard).
# SB-TF-12 Events art + tutorials (24 events: native event screens over each event scene, coach-mark steps from data/config/events_v02_tutorials.json on the real details, EN/TR, lossy small art): + sb_tf12_events_art_ui (exact 5/5 guard).
# SB-PHONE-2026-11-12-F a finished slot takes no new pick until its finish pop is over (other empty slots stay usable; all finishing = no free slot; Reduced = no hold; pause / terminal / reset never stick; +1 Slot): + sb_phone_2026_11_12_f_slot_pop_hold (exact 46/46 guard); SB-TF-02 real supply-tap path at 1x / 2x / 3x / pause / 120 Hz / uneven frames (exact 100/100 guard).
# SB-PERF-DIFF-2026-11-13 faster Difficulty V1 analysis / ProofKernel with byte-identical output (fast CI subset +
#   verdict-only == full route probe): + difficulty_v1_identical_output (exact 8/8 guard).
# SB-PERF-ROUTE-2026-11-13 canonical-access railroad Dijkstra fast path (fast == generic route points case): difficulty_v1_identical_output guard now exact 9/9.
# SB-RELEASE-SIGNING-2026-11-17: mode aab_release (needs build_type release) = validate + clean_clone, then the
#   Gradle build exports a Google Play .aab signed with the upload key (release keystore secrets); bundletool turns it
#   into a universal APK (same key) only for the scans / apksigner / aapt2 checks. No store upload.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validation_only = tests + logs only, NO APK. build_apk = tests then APK export. aab_release = tests then signed Play AAB (build_type release)."
        type: choice
        required: true
        default: validation_only
        options:
          - validation_only
          - build_apk
          - apk_only   # owner 2026-10-30: APK without the test suites (Level Factory already proved the levels)
          - aab_release
      build_type:
        description: "debug = debug keystore (family dev package). release = release keystore secrets only (fails if absent)."
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      local_notifications:
        description: "SB-M43-172: include the ScrubbotsNotify plugin (Gradle build). Off = the prebuilt-template APK as before."
        type: boolean
        default: false
      billing_ads:
        description: "SB-M57-014..016/022: include Google Play Billing + AdMob (Google TEST ad ids) plugins (Gradle build). Off = the APK as before."
        type: boolean
        default: false
      ads_test_mode:
        description: "SB-TF-01 (billing_ads): true = Google TEST ad units (internal testing). false = real AdMob ids from secrets (release only, public release)."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-family-first10-${{ github.ref }}   # per branch: parallel factory jobs never cancel each other's pending runs
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  PRESET: Android Family First10

jobs:
  validate:
    if: ${{ !github.event.repository.private && (inputs.mode != 'apk_only' || inputs.build_type == 'release') }} # public repo only: free standard runners
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (no coordination/sessions evidence, no dev-art trees)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/coordination/sessions/
            !/assets/art/references/
            !/assets/ui/candidates/
            !/assets/ui/generated/

      - name: Godot ${{ env.GODOT_VERSION }} (Linux editor, headless)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: |
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          git checkout -- project.godot   # disposable CI workspace: the import may rewrite it; validate the tracked file

      - name: Release/versioning static check (single version source, release never debug-signed)
        run: python3 -I tools/check_release_versioning.py

      - name: Content validator (production catalog, every level, every supply plan; fail closed)
        run: |
          if "$GODOT" --headless --path . -s res://tools/validate_content.gd > content_validation.log 2>&1; then ec=0; else ec=$?; fi
          cat content_validation.log
          [ $ec -eq 0 ] && ! grep -qE '^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)' content_validation.log \
            && grep -q '^CONTENT_VALIDATION PASS' content_validation.log

      - name: Focused suites (fail closed; every suite logged)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p validate_logs
          S=validate_logs/summary.txt
          echo "mode=${MODE:-<unset>} sha=${GITHUB_SHA} (validation_only => no APK/PCK built)" | tee "$S"
          # Script diagnostics are fail-closed. Only m43_c005f phase4's and m54 037's documented injected plugin-throw line is expected.
          DIAG='^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)'
          INJECTED="SCRIPT ERROR: Invalid call. Nonexistent function 'explode' in base 'Nil'."
          n=$(grep -cE "$DIAG" import.log || true)
          echo "import script_diag=$n" | tee -a "$S"
          fail=0
          [ "$n" -eq 0 ] || { grep -E "$DIAG" import.log || true; fail=1; }
          for s in m35_level_catalog m37_level_progression m55_long_session m43_c005f_phase4_terminal_home_micro \
                   m43_c001a_results_foundation m42_navigation m42_home m40_save_system m40_v04_bootstrap \
                   cp04_remote_content_runtime cp05_remote_content_cache m55_economy_release_regression run_tests \
                   cp05_r01_transaction_cleanup remote_content_family_fixture cp06_disabled_levels m44_ftue \
                   m39a_economy_core m39b_hearts_speed m39c_boosters m39d_daily_collection m39e_full_matrix \
                   m39_v02_atomicity m39_v02_capacity m39_v02_integration m39_v03_full_surface m39_v03_integration \
                   m39_v04_integration m39_v04_tornado_inflight m39_c003_random_any_booster_rewards \
                   m41_settings m59_credits m43_master_c009_daily m43_r15_owner_remediation m43_r15_001_r01_sequential_unlock \
                   m45_debug_tooling m49_responsive_matrix m50_accessibility_audit m51_localization_readiness \
                   m50_color_symbols m28_c002_c004_tile_visual m28_c002_c001_gameplay_v02 m47_touch_r01_mobile_ux \
                   m43_c003_c001_acquisition m46_performance m44_unlock_gate m44_contextual_coach m44_new_badge \
                   m43_c005_c072_feature_unlock_ceremony m43_c005_c074_c077_celebrations \
                   m43_master_c005r_gift_micro_progress sb_polish_002_gift_meter sb_gift_meter_48h sb_polish_004_006_ui_batch sb_phone_2026_11_12_c_copy_state sb_polish_003_booster_vfx sb_m22_008_polish_013_slot_fx m43_master_c005_meta_ceremonies m43_c005f_phase6_unlock_feel \
                   m43_master_c006_shop m43_master_c007_collection m54_collection_set_master_exactly_once m43_master_c008_robots m54_regression_pack_022_027 \
                   m43_master_c010_meta m43_master_c011_c014 m44_pending_packs_gate m44_meta_l1_unlock_ftue m44_meta_verify_achievements_gift m43_master_c007r_pity campaign_l11_l30 campaign_l31_l200 m43_personal_ranks real_play_levels real_play_file_cli ui_vis_006_asset_qa m59_app_version m56_analytics_taxonomy m58_privacy_inventory m58_privacy_consent m54_regression_pack_028_036 m43_172_local_notifications m54_world_regression m60_release_gates m43_ranks_weekly m44_featured_card_onboarding m57_store_products m44_robot_assembly_stages m54_regression_pack_037_038 m57_ads_cadence m57_native_providers m54_cloud_save_seam m49_ad_store_return_layout board_bg01_backdrop sb_phone_2026_11_12_e_win_home sb_tf03_home_profile sb_tf04_gameplay_layout sb_tf05_reward_reveal sb_tf06_tornado_video sb_tf07_ad_placements sb_tf08_achievements_readall sb_tf11_login_days sb_phone_2026_11_12_f_slot_pop_hold difficulty_v1_identical_output ev02_events_v02 ev02_events_ui sb_tf12_events_art_ui; do
            L="validate_logs/$s.log"
            if [ ! -f "tests/$s.gd" ]; then echo "$s MISSING tests/$s.gd status=FAIL" | tee -a "$S"; fail=1; continue; fi
            if timeout 1500 "$GODOT" --headless --path . -s "res://tests/$s.gd" > "$L" 2>&1; then ec=0; else ec=$?; fi
            [ $ec -ne 124 ] || echo "::error::$s TIMEOUT"
            if [ "$s" = m43_c005f_phase4_terminal_home_micro ] || [ "$s" = m54_regression_pack_037_038 ]; then
              diag=$(grep -E "$DIAG" "$L" | grep -cvxF "$INJECTED" || true)
            else
              diag=$(grep -cE "$DIAG" "$L" || true)
            fi
            last=$(grep -E 'PASS|FAIL|RESULT' "$L" | tail -1 || true)
            st=PASS
            if [ $ec -ne 0 ] || [ "$diag" -ne 0 ] || ! printf '%s' "$last" | grep -q PASS || printf '%s' "$last" | grep -q FAIL; then
              st=FAIL; fail=1; grep -E "$DIAG" "$L" || true
            fi
            echo "$s exit=$ec script_diag=$diag status=$st | $last" | tee -a "$S"
          done
          # CP06 Option B: exact 16-case summary is mandatory.
          if grep -qxF 'CP06 disabled levels evidence: PASS (16/16 cases, 0 fail)' validate_logs/cp06_disabled_levels.log 2>/dev/null; then
            echo "CP06 verdict=PASS (16/16)" | tee -a "$S"
          else
            echo "CP06 verdict=FAIL (exact 16/16 summary missing)" | tee -a "$S"; fail=1
          fi
          # M44 FTUE master: exact 21-case summary is mandatory.
          if grep -qxF 'M44 FTUE evidence: PASS (23/23 cases, 0 fail)' validate_logs/m44_ftue.log 2>/dev/null; then
            echo "M44 verdict=PASS (23/23)" | tee -a "$S"
          else
            echo "M44 verdict=FAIL (exact 23/23 summary missing)" | tee -a "$S"; fail=1
          fi
          # M45 debug tooling: exact 8-case summary is mandatory.
          if grep -qxF 'M45 debug tooling evidence: PASS (8/8 cases, 0 fail)' validate_logs/m45_debug_tooling.log 2>/dev/null; then
            echo "M45 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M45 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # M49 responsive matrix: exact 8-case summary is mandatory.
          if grep -qxF 'M49 responsive matrix evidence: PASS (8/8 cases, 0 fail)' validate_logs/m49_responsive_matrix.log 2>/dev/null; then
            echo "M49 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M49 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # M50 accessibility audit: exact 11-case summary is mandatory.
          if grep -qxF 'M50 accessibility audit evidence: PASS (11/11 cases, 0 fail)' validate_logs/m50_accessibility_audit.log 2>/dev/null; then
            echo "M50 verdict=PASS (11/11)" | tee -a "$S"
          else
            echo "M50 verdict=FAIL (exact 11/11 summary missing)" | tee -a "$S"; fail=1
          fi
          # M51 localization readiness: exact 8-case summary is mandatory (SB-M51 EN+TR: l05..l08).
          if grep -qxF 'M51 localization readiness evidence: PASS (8/8 cases, 0 fail)' validate_logs/m51_localization_readiness.log 2>/dev/null; then
