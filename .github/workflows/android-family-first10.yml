name: Android Family First10 APK

# M47-FAMILY-APK-C001 (SB-M47-001 / SB-M47-002): installable Android DEBUG/DEVELOPMENT APK of
# the built-in Levels 1-10 for family testing. Manual dispatch only.
#   validate: real Godot 4.7.2 headless suites (Levels 1-10, Home -> Play -> Results, save,
#             offline remote-content fallback, release regression) on a checkout WITHOUT the
#             1.7 GB coordination/sessions evidence and the three dev-art trees.
#   export:   a disposable workspace in which every owner-excluded tree
#             (.github/android/family_first10_export_exclusions.txt) is ABSENT, plus the same
#             prefixes in the preset exclude_filter; debug keystore from GitHub Secrets, else generated here (never
#             committed); APK + same-preset inspection PCK; machine scans proving zero packaged
#             paths under the excluded prefixes and presence of every runtime-referenced res://
#             file; headless boot of the exported pack; apksigner / aapt2 metadata; artifacts.
# No secret, no network service, no R2 credential is used or packaged.
# CP06 V03: dispatch input `mode` (default validation_only). validation_only runs ONLY `validate`
# (logs artifact only); the `export` job is skipped at job level, so no keystore, templates, APK or
# PCK. build_apk must be selected explicitly and keeps the original export path unchanged.
# M44 FTUE master: tests/m44_ftue.gd added to `validate` (exact 21/21 summary required); the
# 16 earlier suites, CP06 16/16 guard, manual trigger and job-level export guard are unchanged.
# M44 R01: + 17 specialist M39 / M41 Settings / M43 Daily + R15 suites (34 total), same fail-closed rules.
# M45: + tests/m45_debug_tooling.gd (35 total, exact 8/8 guard).
# M44 D2 (owner 2026-10-15): m44_ftue grows to 23 cases (future What's New after L3); M44 guard 23/23.
# M49: + tests/m49_responsive_matrix.gd (36 total, exact 8/8 guard).
# M50: + tests/m50_accessibility_audit.gd (37 total, exact 4/4 guard; 8/8 since SB-M50-004..011; 11/11 since SB-M50-012..018).
# M51: + tests/m51_localization_readiness.gd (38 total, exact 4/4 guard).
# M50 owner decisions A/B (2026-10-15): + tests/m50_color_symbols.gd (exact 10/10 guard) and the tile / gameplay HUD /
#   touch regressions m28_c002_c004_tile_visual, m28_c002_c001_gameplay_v02, m47_touch_r01_mobile_ux, plus
#   m43_c003_c001_acquisition for the symbol-carrying booster target chips (43 total).
# M46: + tests/m46_performance.gd (44 total, exact 22/22 guard).
# SB-M44-031: + tests/m44_unlock_gate.gd (45 total; owner feature unlock table).
# SB-M44-005..006 + SB-M44-013: + tests/m44_contextual_coach.gd + tests/m44_new_badge.gd (47 total).
# SB-M43-072: + tests/m43_c005_c072_feature_unlock_ceremony.gd (48 total; feature unlock ceremony).
# SB-M43-074/075/077: + tests/m43_c005_c074_c077_celebrations.gd (49 total, exact 6/6 guard; Gift/Daily/3-3 Tasks celebrations + Reduced equivalence).
# SB-M43-R05-001/002, SB-M43-013, SB-M43-C005F-007: + 3 suites (52 total, exact 8/8, 32/32, 8/8 guards; Gift micro-progress ticks, Results ceremony hand-off, robot/feature MAJOR_UNLOCK feel).
# SB-M43-078..089 Shop destination: + 1 suite (53 total, exact 15/15 guard; verify-close with 4 added assertion cases).
# SB-M43-090..101 Collection: + m43_master_c007_collection + m54_collection_set_master_exactly_once (55 total, exact 17/17 and M54 PASS guards; pack-inventory entry).
# SB-M43-102..111 Robots: + m43_master_c008_robots (56 total, exact 10/10 guard).
# SB-M43-112..121 Tasks/Daily/Gift: exact 12/12 guard for m43_master_c009_daily (already in the loop; 56 total).
# SB-M43 verify sweep (R09/R10/R12, 123..164, 151): + m43_master_c010_meta + m43_master_c011_c014 (58 total, exact 12/12 and 28/28 guards).
# SB-M44-025 pending-pack inventory (pre-L20 packs wait for card_packs): + m44_pending_packs_gate (59 total, exact 6/6 guard).
# SB-COL-NAV-001 Collection set NEW-count badge + set detail prev/next: k18/k19 in m43_master_c007_collection (59 total, C007 guard now exact 19/19).
# SB-M43-R07-001..006 earned-pack pity + First Collection Sprint tuning: + m43_master_c007r_pity (60 total, exact 11/11 guard).
# SB-CAMPAIGN-L11-L30 20 release-pool levels as campaign L11..L30: + campaign_l11_l30 (61 total, exact 5/5 guard).
# SB-M43-122 RANKS personal rank ladder: + m43_personal_ranks (62 total, exact 8/8 guard).
# SB-M43-131/132 RANKS two tables (all-time + weekly, Monday 00:00 UTC reset): + m43_ranks_weekly (exact 7/7 guard).
# SB-CAMPAIGN-RUNTIME-KERNEL-DIVERGENCE real-play shippability gate: + real_play_levels (63 total, exact 5/5 guard).
# SB-STUDIO-REAL-PLAY-GATE file-mode real-play CLI (tools/real_play_file.gd): + real_play_file_cli (64 total, exact 6/6 guard).
# SB-M44-032/033 + SB-M44-031 part 2 (owner 2026-11-03 meta at L1, no grandfather, Welcome at first Home, booster intros): + m44_meta_l1_unlock_ftue (exact 6/6 guard).
# SB-M44-028/030 (50 achievements pinned, CLAIM once across replay/relaunch/import, Gift Bar from first Home): + m44_meta_verify_achievements_gift (exact 4/4 guard).
# SB-M22-008 + SB-POLISH-013 WAITING slot pulse + finished-batch pop presets: + sb_m22_008_polish_013_slot_fx.
# SB-M54-022..027 regressions (Need a Hand unlocked-only picks, 2x relaunch, rewarded callback ordering, robot idempotency): + m54_regression_pack_022_027 (exact 12/12 guard).
# SB-M54-028..030 + 033..036 regressions (badges across claims / relaunch / new day, BottomNav double tap + modal LIFO, FTUE once-only across cloud restore, pity source idempotency + cloud, event / First-Try / bests across rollover + relaunch, comeback vs reminders): + m54_regression_pack_028_036 (exact 12/12 guard).
# SB-M59-001..005 (docs/RELEASE_BUILDS.md): input `build_type` debug (default; debug keystore, the path above) |
#   release (release keystore secrets ONLY, fails fast when absent, never debug signing; no store upload).
#   Version from data/config/app_version.json via .github/scripts/app_version.py: version/code = build number =
#   run_number + build_offset; outputs build/android/<build_type>/ScrubBots-Android-<build_type>-v<ver>-b<build>.*
#   validate also runs tools/check_release_versioning.py + m59_app_version.
# SB-M56-001..023 analytics taxonomy V1 (consent-gated, schema-validated, mocked sink; economy / collection / navigation / ads / notification events, feature measures): + m56_analytics_taxonomy (exact 27/27 guard).
# SB-M58-001..006 privacy inventory (docs/PRIVACY_DATA_INVENTORY.md lists every permission/network/user:// use): + m58_privacy_inventory (exact 7/7 guard).
# SB-M58-007..014 Settings PRIVACY popup (analytics consent, default OFF) + reminder / receipt privacy guards: + m58_privacy_consent (exact 7/7 guard).
# SB-M43-172 local reminders: + m43_172_local_notifications (exact 12/12 guard). Input `local_notifications` (default false):
#   true builds the ScrubbotsNotify AAR (native/android, javac only), switches the preset to the Gradle build and enables
#   addons/scrubbots_notify (docs/RELEASE_BUILDS.md). false keeps the prebuilt-template APK path unchanged.
# SB-M43-136..141 + 073 + SB-M54-032 owner world table (20 x 150 = 3000), WorldService, World Transition trigger: + m54_world_regression (exact 7/7 guard).
# SB-M59-006..010 release gate (docs/RELEASE_BUILDS.md): validate also runs the content validator
#   (tools/validate_content.gd); clean_clone (tools/clean_clone_check.py) proves a fresh clone imports and passes
#   a smoke suite. A release export needs validate + clean_clone green, also with apk_only; debug apk_only stays
#   the owner's untested quick path. addons/godot_ai (editor-only, untracked) is in the export exclusions.
#   + m59_credits (exact 3/3 guard): Settings CREDITS row + third-party notices popup.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validation_only = tests + logs only, NO APK. build_apk = tests then APK export."
        type: choice
        required: true
        default: validation_only
        options:
          - validation_only
          - build_apk
          - apk_only   # owner 2026-10-30: APK without the test suites (Level Factory already proved the levels)
      build_type:
        description: "debug = debug keystore (family dev package). release = release keystore secrets only (fails if absent)."
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      local_notifications:
        description: "SB-M43-172: include the ScrubbotsNotify plugin (Gradle build). Off = the prebuilt-template APK as before."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-family-first10
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  PRESET: Android Family First10

jobs:
  validate:
    if: ${{ !github.event.repository.private && (inputs.mode != 'apk_only' || inputs.build_type == 'release') }} # public repo only: free standard runners
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (no coordination/sessions evidence, no dev-art trees)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/coordination/sessions/
            !/assets/art/references/
            !/assets/ui/candidates/
            !/assets/ui/generated/

      - name: Godot ${{ env.GODOT_VERSION }} (Linux editor, headless)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: |
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          git checkout -- project.godot   # disposable CI workspace: the import may rewrite it; validate the tracked file

      - name: Release/versioning static check (single version source, release never debug-signed)
        run: python3 -I tools/check_release_versioning.py

      - name: Content validator (production catalog, every level, every supply plan; fail closed)
        run: |
          if "$GODOT" --headless --path . -s res://tools/validate_content.gd > content_validation.log 2>&1; then ec=0; else ec=$?; fi
          cat content_validation.log
          [ $ec -eq 0 ] && ! grep -qE '^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)' content_validation.log \
            && grep -q '^CONTENT_VALIDATION PASS' content_validation.log

      - name: Focused suites (fail closed; every suite logged)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p validate_logs
          S=validate_logs/summary.txt
          echo "mode=${MODE:-<unset>} sha=${GITHUB_SHA} (validation_only => no APK/PCK built)" | tee "$S"
          # Script diagnostics are fail-closed. Only m43_c005f's documented injected plugin-throw line is expected.
          DIAG='^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)'
          INJECTED="SCRIPT ERROR: Invalid call. Nonexistent function 'explode' in base 'Nil'."
          n=$(grep -cE "$DIAG" import.log || true)
          echo "import script_diag=$n" | tee -a "$S"
          fail=0
          [ "$n" -eq 0 ] || { grep -E "$DIAG" import.log || true; fail=1; }
          for s in m35_level_catalog m37_level_progression m55_long_session m43_c005f_phase4_terminal_home_micro \
                   m43_c001a_results_foundation m42_navigation m42_home m40_save_system m40_v04_bootstrap \
                   cp04_remote_content_runtime cp05_remote_content_cache m55_economy_release_regression run_tests \
                   cp05_r01_transaction_cleanup remote_content_family_fixture cp06_disabled_levels m44_ftue \
                   m39a_economy_core m39b_hearts_speed m39c_boosters m39d_daily_collection m39e_full_matrix \
                   m39_v02_atomicity m39_v02_capacity m39_v02_integration m39_v03_full_surface m39_v03_integration \
                   m39_v04_integration m39_v04_tornado_inflight m39_c003_random_any_booster_rewards \
                   m41_settings m59_credits m43_master_c009_daily m43_r15_owner_remediation m43_r15_001_r01_sequential_unlock \
                   m45_debug_tooling m49_responsive_matrix m50_accessibility_audit m51_localization_readiness \
                   m50_color_symbols m28_c002_c004_tile_visual m28_c002_c001_gameplay_v02 m47_touch_r01_mobile_ux \
                   m43_c003_c001_acquisition m46_performance m44_unlock_gate m44_contextual_coach m44_new_badge \
                   m43_c005_c072_feature_unlock_ceremony m43_c005_c074_c077_celebrations \
                   m43_master_c005r_gift_micro_progress sb_polish_002_gift_meter sb_polish_004_006_ui_batch sb_polish_003_booster_vfx sb_m22_008_polish_013_slot_fx m43_master_c005_meta_ceremonies m43_c005f_phase6_unlock_feel \
                   m43_master_c006_shop m43_master_c007_collection m54_collection_set_master_exactly_once m43_master_c008_robots m54_regression_pack_022_027 \
                   m43_master_c010_meta m43_master_c011_c014 m44_pending_packs_gate m44_meta_l1_unlock_ftue m44_meta_verify_achievements_gift m43_master_c007r_pity campaign_l11_l30 m43_personal_ranks real_play_levels real_play_file_cli ui_vis_006_asset_qa m59_app_version m56_analytics_taxonomy m58_privacy_inventory m58_privacy_consent m54_regression_pack_028_036 m43_172_local_notifications m54_world_regression m60_release_gates m43_ranks_weekly; do
            L="validate_logs/$s.log"
            if [ ! -f "tests/$s.gd" ]; then echo "$s MISSING tests/$s.gd status=FAIL" | tee -a "$S"; fail=1; continue; fi
            if timeout 1500 "$GODOT" --headless --path . -s "res://tests/$s.gd" > "$L" 2>&1; then ec=0; else ec=$?; fi
            [ $ec -ne 124 ] || echo "::error::$s TIMEOUT"
            if [ "$s" = m43_c005f_phase4_terminal_home_micro ]; then
              diag=$(grep -E "$DIAG" "$L" | grep -cvxF "$INJECTED" || true)
            else
              diag=$(grep -cE "$DIAG" "$L" || true)
            fi
            last=$(grep -E 'PASS|FAIL|RESULT' "$L" | tail -1 || true)
            st=PASS
            if [ $ec -ne 0 ] || [ "$diag" -ne 0 ] || ! printf '%s' "$last" | grep -q PASS || printf '%s' "$last" | grep -q FAIL; then
              st=FAIL; fail=1; grep -E "$DIAG" "$L" || true
            fi
            echo "$s exit=$ec script_diag=$diag status=$st | $last" | tee -a "$S"
          done
          # CP06 Option B: exact 16-case summary is mandatory.
          if grep -qxF 'CP06 disabled levels evidence: PASS (16/16 cases, 0 fail)' validate_logs/cp06_disabled_levels.log 2>/dev/null; then
            echo "CP06 verdict=PASS (16/16)" | tee -a "$S"
          else
            echo "CP06 verdict=FAIL (exact 16/16 summary missing)" | tee -a "$S"; fail=1
          fi
          # M44 FTUE master: exact 21-case summary is mandatory.
          if grep -qxF 'M44 FTUE evidence: PASS (23/23 cases, 0 fail)' validate_logs/m44_ftue.log 2>/dev/null; then
            echo "M44 verdict=PASS (23/23)" | tee -a "$S"
          else
            echo "M44 verdict=FAIL (exact 23/23 summary missing)" | tee -a "$S"; fail=1
          fi
          # M45 debug tooling: exact 8-case summary is mandatory.
          if grep -qxF 'M45 debug tooling evidence: PASS (8/8 cases, 0 fail)' validate_logs/m45_debug_tooling.log 2>/dev/null; then
            echo "M45 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M45 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # M49 responsive matrix: exact 8-case summary is mandatory.
          if grep -qxF 'M49 responsive matrix evidence: PASS (8/8 cases, 0 fail)' validate_logs/m49_responsive_matrix.log 2>/dev/null; then
            echo "M49 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M49 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # M50 accessibility audit: exact 11-case summary is mandatory.
          if grep -qxF 'M50 accessibility audit evidence: PASS (11/11 cases, 0 fail)' validate_logs/m50_accessibility_audit.log 2>/dev/null; then
            echo "M50 verdict=PASS (11/11)" | tee -a "$S"
          else
            echo "M50 verdict=FAIL (exact 11/11 summary missing)" | tee -a "$S"; fail=1
          fi
          # M51 localization readiness: exact 8-case summary is mandatory (SB-M51 EN+TR: l05..l08).
          if grep -qxF 'M51 localization readiness evidence: PASS (8/8 cases, 0 fail)' validate_logs/m51_localization_readiness.log 2>/dev/null; then
            echo "M51 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M51 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # M50 colour symbols + navy PLAY + HUD price: exact 10-case summary is mandatory.
          if grep -qxF 'M50 color symbols evidence: PASS (10/10 cases, 0 fail)' validate_logs/m50_color_symbols.log 2>/dev/null; then
            echo "M50S verdict=PASS (10/10)" | tee -a "$S"
          else
            echo "M50S verdict=FAIL (exact 10/10 summary missing)" | tee -a "$S"; fail=1
          fi
          # M46 performance evidence: exact 22-case summary is mandatory.
          if grep -qxF 'M46 performance evidence: PASS (22/22 cases, 0 fail)' validate_logs/m46_performance.log 2>/dev/null; then
            echo "M46 verdict=PASS (22/22)" | tee -a "$S"
          else
            echo "M46 verdict=FAIL (exact 22/22 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-074/075/077 celebrations: exact 6-case summary is mandatory.
          if grep -qxF 'M43 C005 gift/daily/tasks celebrations evidence: PASS (6/6 cases, 0 fail)' validate_logs/m43_c005_c074_c077_celebrations.log 2>/dev/null; then
            echo "M43-C074 verdict=PASS (6/6)" | tee -a "$S"
          else
            echo "M43-C074 verdict=FAIL (exact 6/6 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-R05-001/002 gift micro-progress: exact 8-case summary is mandatory.
          if grep -qxF 'M43 master C005R gift micro-progress evidence: PASS (8/8 cases, 0 fail)' validate_logs/m43_master_c005r_gift_micro_progress.log 2>/dev/null; then
            echo "M43-R05 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M43-R05 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-POLISH-002 gift meter cycle / migration / reward text: exact 11-case summary is mandatory.
          if grep -qxF 'SB-POLISH-002 gift meter evidence: PASS (11/11 cases, 0 fail)' validate_logs/sb_polish_002_gift_meter.log 2>/dev/null; then
            echo "SB-POLISH-002 verdict=PASS (11/11)" | tee -a "$S"
          else
            echo "SB-POLISH-002 verdict=FAIL (exact 11/11 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-013 meta ceremonies + Results hand-off: exact 32-case summary is mandatory.
          if grep -qxF 'M43 master C005 meta ceremonies evidence: PASS (32/32 cases, 0 fail)' validate_logs/m43_master_c005_meta_ceremonies.log 2>/dev/null; then
            echo "M43-C005 verdict=PASS (32/32)" | tee -a "$S"
          else
            echo "M43-C005 verdict=FAIL (exact 32/32 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-C005F-007 unlock feel: exact 8-case summary is mandatory.
          if grep -qxF 'M43 C005F phase6 unlock feel evidence: PASS (8/8 cases, 0 fail)' validate_logs/m43_c005f_phase6_unlock_feel.log 2>/dev/null; then
            echo "M43-F007 verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M43-F007 verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-078..089 Shop destination: exact 15-case summary is mandatory.
          if grep -qxF 'M43 master C006 Shop evidence: PASS (15/15 cases, 0 fail)' validate_logs/m43_master_c006_shop.log 2>/dev/null; then
            echo "M43-C006 verdict=PASS (15/15)" | tee -a "$S"
          else
            echo "M43-C006 verdict=FAIL (exact 15/15 summary missing)" | tee -a "$S"; fail=1
          fi
          # SB-M43-090..101 Collection: exact 17-case summary + set/master exactly-once line are mandatory.
          if grep -qxF 'M43 master C007 Collection evidence: PASS (19/19 cases, 0 fail)' validate_logs/m43_master_c007_collection.log 2>/dev/null; then
            echo "M43-C007 verdict=PASS (19/19)" | tee -a "$S"
          else
            echo "M43-C007 verdict=FAIL (exact 19/19 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 master C008 Robots evidence: PASS (10/10 cases, 0 fail)' validate_logs/m43_master_c008_robots.log 2>/dev/null; then
            echo "M43-C008 verdict=PASS (10/10)" | tee -a "$S"
          else
            echo "M43-C008 verdict=FAIL (exact 10/10 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M54 regression pack 022-027: PASS (12/12 cases, 0 fail)' validate_logs/m54_regression_pack_022_027.log 2>/dev/null; then
            echo "M54-022..027 verdict=PASS (12/12)" | tee -a "$S"
          else
            echo "M54-022..027 verdict=FAIL (exact 12/12 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M54 regression pack 028-036: PASS (12/12 cases, 0 fail)' validate_logs/m54_regression_pack_028_036.log 2>/dev/null; then
            echo "M54-028..036 verdict=PASS (12/12)" | tee -a "$S"
          else
            echo "M54-028..036 verdict=FAIL (exact 12/12 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 master C009 Tasks / Daily / Gift evidence: PASS (12/12 cases, 0 fail)' validate_logs/m43_master_c009_daily.log 2>/dev/null; then
            echo "M43-C009 verdict=PASS (12/12)" | tee -a "$S"
          else
            echo "M43-C009 verdict=FAIL (exact 12/12 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 master C010 meta evidence: PASS (12/12 cases, 0 fail)' validate_logs/m43_master_c010_meta.log 2>/dev/null; then
            echo "M43-C010 verdict=PASS (12/12)" | tee -a "$S"
          else
            echo "M43-C010 verdict=FAIL (exact 12/12 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 master C011-C014 evidence: PASS (29/29 cases, 0 fail)' validate_logs/m43_master_c011_c014.log 2>/dev/null; then
            echo "M43-C011 verdict=PASS (29/29)" | tee -a "$S"
          else
            echo "M43-C011 verdict=FAIL (exact 29/29 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M44 PENDING PACKS GATE: PASS (6/6 cases, 0 fail)' validate_logs/m44_pending_packs_gate.log 2>/dev/null; then
            echo "M44-PENDING-PACKS verdict=PASS (6/6)" | tee -a "$S"
          else
            echo "M44-PENDING-PACKS verdict=FAIL (exact 6/6 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M44 meta L1 unlock + FTUE evidence: PASS (6/6 cases, 0 fail)' validate_logs/m44_meta_l1_unlock_ftue.log 2>/dev/null; then
            echo "M44-META-L1 verdict=PASS (6/6)" | tee -a "$S"
          else
            echo "M44-META-L1 verdict=FAIL (exact 6/6 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M44 meta verify achievements + gift evidence: PASS (4/4 cases, 0 fail)' validate_logs/m44_meta_verify_achievements_gift.log 2>/dev/null; then
            echo "M44-META-VERIFY verdict=PASS (4/4)" | tee -a "$S"
          else
            echo "M44-META-VERIFY verdict=FAIL (exact 4/4 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 master C007R pity evidence: PASS (11/11 cases, 0 fail)' validate_logs/m43_master_c007r_pity.log 2>/dev/null; then
            echo "M43-C007R verdict=PASS (11/11)" | tee -a "$S"
          else
            echo "M43-C007R verdict=FAIL (exact 11/11 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 personal ranks evidence: PASS (8/8 cases, 0 fail)' validate_logs/m43_personal_ranks.log 2>/dev/null; then
            echo "M43-RANKS verdict=PASS (8/8)" | tee -a "$S"
          else
            echo "M43-RANKS verdict=FAIL (exact 8/8 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M43 ranks weekly evidence: PASS (7/7 cases, 0 fail)' validate_logs/m43_ranks_weekly.log 2>/dev/null; then
            echo "M43-RANKS-WEEKLY verdict=PASS (7/7)" | tee -a "$S"
          else
            echo "M43-RANKS-WEEKLY verdict=FAIL (exact 7/7 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'REAL PLAY LEVELS: PASS (4/4 cases, 0 fail)' validate_logs/real_play_levels.log 2>/dev/null; then
            echo "REAL-PLAY-LEVELS verdict=PASS (4/4)" | tee -a "$S"
          else
            echo "REAL-PLAY-LEVELS verdict=FAIL (exact 4/4 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'REAL PLAY FILE CLI: PASS (6/6 cases, 0 fail)' validate_logs/real_play_file_cli.log 2>/dev/null; then
            echo "REAL-PLAY-FILE-CLI verdict=PASS (6/6)" | tee -a "$S"
          else
            echo "REAL-PLAY-FILE-CLI verdict=FAIL (exact 6/6 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'CAMPAIGN L11-L30 evidence: PASS (5/5 cases, 0 fail)' validate_logs/campaign_l11_l30.log 2>/dev/null; then
            echo "CAMPAIGN-L11-L30 verdict=PASS (5/5)" | tee -a "$S"
          else
            echo "CAMPAIGN-L11-L30 verdict=FAIL (exact 5/5 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M54 COLLECTION SET/MASTER EXACTLY-ONCE: PASS' validate_logs/m54_collection_set_master_exactly_once.log 2>/dev/null; then
            echo "M54-COLLECTION verdict=PASS" | tee -a "$S"
          else
            echo "M54-COLLECTION verdict=FAIL (exact PASS line missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M56 analytics taxonomy evidence: PASS (27/27 cases, 0 fail)' validate_logs/m56_analytics_taxonomy.log 2>/dev/null; then
            echo "M56-ANALYTICS verdict=PASS (27/27)" | tee -a "$S"
          else
            echo "M56-ANALYTICS verdict=FAIL (exact 27/27 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M58 privacy inventory evidence: PASS (7/7 cases, 0 fail)' validate_logs/m58_privacy_inventory.log 2>/dev/null; then
            echo "M58-PRIVACY verdict=PASS (7/7)" | tee -a "$S"
          else
            echo "M58-PRIVACY verdict=FAIL (exact 7/7 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M58 privacy consent evidence: PASS (7/7 cases, 0 fail)' validate_logs/m58_privacy_consent.log 2>/dev/null; then
            echo "M58-CONSENT verdict=PASS (7/7)" | tee -a "$S"
          else
            echo "M58-CONSENT verdict=FAIL (exact 7/7 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'SB-M43-172 local notifications: PASS (12/12 cases, 0 fail)' validate_logs/m43_172_local_notifications.log 2>/dev/null; then
            echo "M43-172-NOTIFY verdict=PASS (12/12)" | tee -a "$S"
          else
            echo "M43-172-NOTIFY verdict=FAIL (exact 12/12 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'M54 world regression evidence: PASS (7/7 cases, 0 fail)' validate_logs/m54_world_regression.log 2>/dev/null; then
            echo "M54-WORLDS verdict=PASS (7/7)" | tee -a "$S"
          else
            echo "M54-WORLDS verdict=FAIL (exact 7/7 summary missing)" | tee -a "$S"; fail=1
          fi
          if grep -qxF 'SB-M59 credits evidence: PASS (3/3 cases, 0 fail)' validate_logs/m59_credits.log 2>/dev/null; then
            echo "M59-CREDITS verdict=PASS (3/3)" | tee -a "$S"
          else
            echo "M59-CREDITS verdict=FAIL (exact 3/3 summary missing)" | tee -a "$S"; fail=1
          fi
          echo "aggregate=$([ $fail -eq 0 ] && echo PASS || echo FAIL)" | tee -a "$S"
          { echo "### validate (mode=${MODE:-<unset>}, ${GITHUB_SHA})"; echo '```'; cat "$S"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ScrubBots-Android-validation-logs
          path: |
            validate_logs/
            import.log
            content_validation.log
          retention-days: 30

  # SB-M59-009: a fresh clone of the commit (tracked files only: no .godot cache, no untracked or
  # editor-only addon) imports without script errors and passes a smoke suite.
  clean_clone:
    if: ${{ !github.event.repository.private && (inputs.mode != 'apk_only' || inputs.build_type == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot ${{ env.GODOT_VERSION }} (Linux editor, headless)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Clean clone import + smoke suite
        run: python3 -I tools/clean_clone_check.py --godot "$GODOT" --work "$RUNNER_TEMP/clean_clone"

  export:
    needs: [validate, clean_clone]
    # Job-level guard: build_apk exports after validate; release (build_apk or apk_only) also needs clean_clone;
    # debug apk_only is the owner's untested quick path. validation_only / unset / unknown skip.
    if: ${{ always() && !github.event.repository.private && ((inputs.mode == 'apk_only' && inputs.build_type != 'release') || ((inputs.mode == 'build_apk' || inputs.mode == 'apk_only') && needs.validate.result == 'success' && (inputs.build_type != 'release' || needs.clean_clone.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout export workspace (owner-excluded trees ABSENT)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/coordination/
            !/docs/
            !/tests/
            !/tools/
            !/level_factory/
            !/content_pipeline/
            !/assets/art/references/
            !/assets/ui/candidates/
            !/assets/ui/generated/
            !/addons/godot_ai/

      - name: Prove excluded trees are absent from the export workspace
        run: |
          bad=0
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            if [ -e "$p" ]; then echo "::error::excluded tree present in export workspace: $p"; bad=1; else echo "absent: $p"; fi
          done < .github/android/family_first10_export_exclusions.txt
          exit $bad

      - name: Version + output paths (data/config/app_version.json, build = run_number + build_offset)
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          python3 -I .github/scripts/app_version.py android "$BUILD_TYPE" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          cat data/config/app_version.json

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot ${{ env.GODOT_VERSION }} editor + export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL" && unzip -q tpl.tpz -d "$RUNNER_TEMP/tpl" && mv "$RUNNER_TEMP"/tpl/templates/* "$TPL/"
          rm -f godot.zip tpl.tpz
          ls "$TPL" | grep -i android

      - name: Android SDK + editor settings
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      # SB-M34-006 (owner 2026-10-31): sign with the stable debug key from GitHub Secrets so every
      # family APK installs over the previous one (keeps the save); generated key only when absent.
      - name: Debug keystore (GitHub Secret, else generated in CI; never committed)
        if: ${{ inputs.build_type != 'release' }}
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/family-debug.keystore"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            KS_USER="$KS_ALIAS_SECRET"; KS_PASS="$KS_PASS_SECRET"
            echo "debug keystore: stable GitHub Secret"
          else
            KS_USER=androiddebugkey; KS_PASS=android
            keytool -genkeypair -v -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_USER" \
              -dname "CN=ScrubBots Family Debug,O=ScrubBots Dev,C=US" -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
            echo "debug keystore: generated (secret absent; signature changes every run)"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KS_USER" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf 'export/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "%s"\nexport/android/debug_keystore_pass = "%s"\n' \
              "$KS" "$KS_USER" "$KS_PASS" >> "$HOME/.config/godot/$f"
          done

      # SB-M59-002: release signing ONLY from the owner's release keystore secrets; fail fast, no fallback.
      - name: Release keystore (GitHub Secrets only; fails fast when absent)
        if: ${{ inputs.build_type == 'release' }}
        env:
          RKS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RKS_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RKS_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$RKS_B64" ] || [ -z "$RKS_PASS" ] || [ -z "$RKS_ALIAS" ]; then
            echo "::error::release build needs GitHub Secrets ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEYSTORE_ALIAS (docs/RELEASE_BUILDS.md). Not signing."
            exit 1
          fi
          RKS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RKS_B64" | base64 -d > "$RKS"
          keytool -list -keystore "$RKS" -storepass "$RKS_PASS" -alias "$RKS_ALIAS" >/dev/null \
            || { echo "::error::release keystore secret does not open with the given password / alias"; exit 1; }
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RKS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RKS_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RKS_PASS" >> "$GITHUB_ENV"

      - name: Export preset (tracked template -> export_presets.cfg)
        run: |
          # debug keeps the family dev package (installs beside a store build); release = store package.
          if [ "$BUILD_TYPE" = release ]; then PKG=com.sekiph82.scrubbots; LABEL=SCRUBBOTS; else PKG=com.sekiph82.scrubbots.familydev; LABEL="ScrubBots Family Dev"; fi
          sed -e "s/@VERSION_CODE@/${APP_BUILD}/" -e "s/@VERSION_NAME@/${APP_VERSION_NAME}/" \
            -e "s/@PACKAGE@/${PKG}/" -e "s/@APP_LABEL@/${LABEL}/" \
            .github/android/export_presets_family_first10.cfg > export_presets.cfg
          cat export_presets.cfg

      # SB-M43-172: Android plugins need the Gradle build, so the plugin rides only on this input.
      - name: ScrubbotsNotify plugin + Gradle build (input local_notifications)
        if: ${{ inputs.local_notifications }}
        run: |
          python3 -I native/android/scrubbots_notify/build_aar.py \
            --android-jar "$(ls -d "$ANDROID_SDK"/platforms/android-*/android.jar | sort -V | tail -1)" \
            --android-source "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" \
            --out addons/scrubbots_notify/android/scrubbots_notify.aar
          sed -i 's#^gradle_build/use_gradle_build=false#gradle_build/use_gradle_build=true#' export_presets.cfg
          grep -qx 'gradle_build/use_gradle_build=true' export_presets.cfg
          sed -i 's#^enabled=PackedStringArray(#enabled=PackedStringArray("res://addons/scrubbots_notify/plugin.cfg", #' project.godot
          grep -q 'addons/scrubbots_notify/plugin.cfg' project.godot
          "$GODOT" --headless --path . --install-android-build-template
          test -f android/build/build.gradle

      - name: Import + export APK and same-preset inspection PCK
        run: |
          mkdir -p "$OUT_DIR" out
          "$GODOT" --headless --path . --import > out/import.log 2>&1 || true
          if [ "$BUILD_TYPE" = release ]; then EXPORT=--export-release; else EXPORT=--export-debug; fi
          "$GODOT" --headless --path . "$EXPORT" "$PRESET" "${OUT_DIR}/${ARTIFACT}.apk" > out/export_apk.log 2>&1 \
            || { tail -40 out/export_apk.log; exit 1; }
          "$GODOT" --headless --path . --export-pack "$PRESET" "${OUT_DIR}/${ARTIFACT}.pck" > out/export_pck.log 2>&1 \
            || { tail -40 out/export_pck.log; exit 1; }
          ls -la "$OUT_DIR"
          test -s "${OUT_DIR}/${ARTIFACT}.apk" && test -s "${OUT_DIR}/${ARTIFACT}.pck"

      - name: Packaged-path scan of the exported PCK (zero excluded paths, every runtime reference present)
        run: |
          # Every res:// file literal referenced by shipping scripts / scenes / data / addons /
          # project settings that exists in this (export) source tree must be in the pack. Editor-only
          # addons/*/plugin.cfg (named only by project.godot [editor_plugins]) is not a runtime file.
          grep -rhoE 'res://[A-Za-z0-9_./-]+\.[A-Za-z0-9]+' scripts scenes data addons project.godot default_bus_layout.tres 2>/dev/null \
            | sort -u | grep -v '/plugin\.cfg$' | while read -r p; do if [ -f "${p#res://}" ]; then echo "$p"; fi; done > out/required_runtime_paths.txt
          wc -l out/required_runtime_paths.txt
          cp -r .github/android/pck_probe "$RUNNER_TEMP/pck_probe"
          "$GODOT" --headless --path "$RUNNER_TEMP/pck_probe" -s res://pck_scan.gd -- \
            "$PWD/${OUT_DIR}/${ARTIFACT}.pck" "$PWD/.github/android/family_first10_export_exclusions.txt" \
            "$PWD/out/required_runtime_paths.txt" "$PWD/out/pck_scan_report.json" 2>&1 | tee out/pck_scan.log
          grep -q "verdict=PASS" out/pck_scan.log

      - name: Packaged-path scan of the APK itself
        run: |
          unzip -Z1 "${OUT_DIR}/${ARTIFACT}.apk" > out/apk_entries.txt
          wc -l out/apk_entries.txt
          echo "apk assets/ entries: $(grep -c '^assets/' out/apk_entries.txt || true); embedded .pck: $(grep -E '\.pck$' out/apk_entries.txt | tr '\n' ' ')" | tee out/apk_scan.txt
          hits=0
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            n=$(grep -cE "^(assets/)?${p}/" out/apk_entries.txt || true)
            echo "apk entries under ${p}/: $n" | tee -a out/apk_scan.txt
            hits=$((hits + n))
          done < .github/android/family_first10_export_exclusions.txt
          echo "APK_SCAN forbidden_total=$hits" | tee -a out/apk_scan.txt
          [ "$hits" -eq 0 ]

      - name: Headless boot of the exported pack (offline, no endpoint)
        run: |
          mkdir -p "$RUNNER_TEMP/boot" && cd "$RUNNER_TEMP/boot"
          timeout 300 "$GODOT" --headless --main-pack "$GITHUB_WORKSPACE/${OUT_DIR}/${ARTIFACT}.pck" --quit-after 600 \
            > "$GITHUB_WORKSPACE/out/boot.log" 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          tail -20 out/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Resource file not found|Failed to load script" out/boot.log; then
            echo "::error::exported pack boot reported missing / broken resources"; exit 1
          fi

      - name: APK signature / metadata / hash
        run: |
          APK="${OUT_DIR}/${ARTIFACT}.apk"
          file "$APK" | tee out/apk_metadata.txt
          unzip -tq "$APK" | tee -a out/apk_metadata.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee -a out/apk_metadata.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|^application-label|^native-code|^launchable-activity|^sdkVersion|^targetSdkVersion|^uses-permission" | tee -a out/apk_metadata.txt
          "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -iE "screenOrientation|debuggable" | tee -a out/apk_metadata.txt
          grep -E "^lib/" out/apk_entries.txt | cut -d/ -f2 | sort -u | sed 's/^/abi: /' | tee -a out/apk_metadata.txt
          if [ "$BUILD_TYPE" = release ] && grep -iE "debuggable|certificate DN:.*debug" out/apk_metadata.txt; then
            echo "::error::release APK is debuggable or signed with a debug certificate"; exit 1
          fi
          sha256sum "$APK" "${OUT_DIR}/${ARTIFACT}.pck" | tee out/sha256.txt
          stat -c '%n %s bytes' "$APK" "${OUT_DIR}/${ARTIFACT}.pck" | tee out/sizes.txt
          {
            echo "## ${ARTIFACT}"
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```'; cat out/sizes.txt out/sha256.txt out/apk_scan.txt; grep PCK_SCAN out/pck_scan.log; cat out/apk_metadata.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}.apk
          path: ${{ env.OUT_DIR }}/${{ env.ARTIFACT }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload inspection pack + scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}-inspection
          path: |
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT }}.pck
            out/
          retention-days: 30
