# OWNER 2026-10-22: cost freeze LIFTED. Repository is public, so standard GitHub-hosted
# runners are free. Jobs run only while the repo is public (auto-stop if it is made private).

name: iOS IPA

# Actions sekmesinden "Run workflow" ile elle calistirilir.
# M47-FAMILY-APK-IOS-EXPORT-R02: clean-import / package-hygiene gate (same signing policy:
# UNSIGNED IPA, the owner signs it with xtool at install time).
#   - checkout workspace WITHOUT the nine owner-excluded developer trees
#     (.github/android/family_first10_export_exclusions.txt, same as the Android Family export);
#     the broken legacy assets/ui/final/gameplay/buttons/icon_pause.png it used to skip was
#     deleted as a confirmed orphan (SB-M22-027, docs/M22_027_IMAGE_INVENTORY.md);
#   - the Godot import is FAIL-CLOSED (no "|| true"): any failed resource load / import, corrupt
#     file, script or parse error fails the run; the full import log is kept;
#   - the PCK inside the built IPA is scanned (zero excluded developer paths, every runtime
#     res:// reference present, main scene) and boots headless; the inner IPA SHA-256 is logged.
# SB-M59-001..005 (docs/RELEASE_BUILDS.md): input `build_type` debug (default; the unsigned IPA above) |
#   release (App Store distribution signing from GitHub Secrets ONLY, fails fast when absent; the IPA is
#   exported to the runner, NEVER uploaded). Version from data/config/app_version.json via
#   .github/scripts/app_version.py: CFBundleShortVersionString = version, CFBundleVersion = build number
#   (run_number + build_offset). Godot/Xcode build under the fixed name Scrubbots (pack/scheme/binary lookup), then
#   the IPA is renamed to build/ios/<build_type>/ScrubBots-iOS-<build_type>-v<ver>-b<build>.ipa.
# SB-M43-171/172: input `local_notifications` (default false) builds the ScrubbotsNotify GDExtension
#   (native/ios, UNUserNotificationCenter permission + local reminders) into res://bin/ before the import,
#   so the export embeds it. false = the IPA exactly as before.
# SB-M59-006/007/009 (docs/RELEASE_BUILDS.md): a release IPA first needs the release_gate job green: the
#   release/versioning check, the content validator, every Android validate suite with its exact guard
#   (tools/run_suites.py reads the list from android-family-first10.yml) and the clean-clone check. Debug skips it.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = unsigned IPA (owner signs with xtool). release = distribution-signed IPA from secrets only (fails if absent)."
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
      local_notifications:
        description: "SB-M43-171/172: include the ScrubbotsNotify GDExtension (local reminders + permission)."
        type: boolean
        default: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  APP_NAME: Scrubbots   # fixed Godot export / Xcode project / binary / .pck basename; renamed to ARTIFACT only at the end

jobs:
  release_gate:
    if: ${{ !github.event.repository.private && inputs.build_type == 'release' }} # public repo only: free standard runners
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot ${{ env.GODOT_VERSION }} (Linux editor, headless)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Clean clone import + smoke suite
        run: python3 -I tools/clean_clone_check.py --godot "$GODOT" --work "$RUNNER_TEMP/clean_clone"

      - name: Workspace = the Android validate checkout (no session evidence, no dev-art trees)
        run: git sparse-checkout set --no-cone '/*' '!/coordination/sessions/' '!/assets/art/references/' '!/assets/ui/candidates/' '!/assets/ui/generated/'

      - name: Import (fail closed on script diagnostics)
        run: |
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          git checkout -- project.godot
          ! grep -E '^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)' import.log

      - name: Release/versioning static check
        run: python3 -I tools/check_release_versioning.py

      - name: Content validator
        run: |
          if "$GODOT" --headless --path . -s res://tools/validate_content.gd > content_validation.log 2>&1; then ec=0; else ec=$?; fi
          cat content_validation.log
          [ $ec -eq 0 ] && ! grep -qE '^(ERROR: )?(SCRIPT ERROR|Parse Error|Failed to load script)' content_validation.log             && grep -q '^CONTENT_VALIDATION PASS' content_validation.log

      - name: Every Android validate suite (exact guards)
        run: python3 -I tools/run_suites.py

      - name: Release gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ScrubBots-iOS-release-gate-logs
          path: |
            validate_logs/
            import.log
            content_validation.log
          retention-days: 30

  ipa:
    needs: release_gate
    # Debug builds without the gate; release only after release_gate succeeded.
    if: ${{ always() && !github.event.repository.private && (inputs.build_type != 'release' || needs.release_gate.result == 'success') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/coordination/
            !/docs/
            !/tests/
            !/tools/
            !/level_factory/
            !/content_pipeline/
            !/assets/art/references/
            !/assets/ui/candidates/
            !/assets/ui/generated/
            !/addons/godot_ai/

      - name: Import workspace has only runtime sources
        run: |
          bad=0
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            if [ -e "$p" ]; then echo "::error::excluded developer tree present: $p"; bad=1; else echo "absent: $p"; fi
          done < .github/android/family_first10_export_exclusions.txt
          exit $bad

      - name: Version + output paths (data/config/app_version.json, build = run_number + build_offset)
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          python3 -I .github/scripts/app_version.py ios "$BUILD_TYPE" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          cat data/config/app_version.json

      # SB-M59-002: distribution signing ONLY from the owner's secrets; fail fast, no unsigned/debug fallback.
      - name: Release signing (GitHub Secrets only; fails fast when absent)
        if: ${{ inputs.build_type == 'release' }}
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PASS" ] || [ -z "$PROFILE_B64" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::release build needs GitHub Secrets IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 and IOS_TEAM_ID (docs/RELEASE_BUILDS.md). Not signing."
            exit 1
          fi
          KC="$RUNNER_TEMP/release.keychain-db"; KC_PASS=$(uuidgen)
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/dist.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/dist.mobileprovision" "$d/$UUID.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "IOS_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "release signing: certificate + profile $UUID installed"

      - name: Godot + export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL" && unzip -q tpl.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$TPL/"
          rm -f godot.zip tpl.tpz
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      # SB-M43-171/172: plain C GDExtension API (header dumped from this Godot), no third-party code.
      - name: ScrubbotsNotify GDExtension (input local_notifications)
        if: ${{ inputs.local_notifications }}
        run: |
          mkdir -p bin "$RUNNER_TEMP/gdx"
          (cd "$RUNNER_TEMP/gdx" && "$GODOT" --headless --dump-gdextension-interface)
          xcrun --sdk iphoneos clang -dynamiclib -fobjc-arc -arch arm64 -miphoneos-version-min=12.0 \
            -I "$RUNNER_TEMP/gdx" -framework Foundation -framework UserNotifications \
            -install_name @rpath/libscrubbots_notify.dylib \
            -o bin/libscrubbots_notify.dylib native/ios/scrubbots_notify/scrubbots_notify.m
          cp native/ios/scrubbots_notify/scrubbots_notify.gdextension bin/
          nm -gU bin/libscrubbots_notify.dylib | grep scrubbots_notify_init

      # export_presets.cfg repoda gitignore'da; CI icin burada uretiliyor.
      # Imza yok: xtool install telefona yuklerken kendi hesabinla imzaliyor.
      - name: iOS export preset
        run: |
          cat > export_presets.cfg <<CFG
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          export_filter="all_resources"
          include_filter="addons/game_feel_flow/LICENSE, addons/saltmire_spark/LICENSE.txt"
          ; Gelistirme/denetim dosyalari oyuna girmesin (coordination 1.7 GB); workspace'te de yoklar
          exclude_filter="coordination/*, docs/*, tests/*, tools/*, level_factory/*, content_pipeline/*, assets/art/references/*, assets/ui/generated/*, assets/ui/candidates/*, addons/godot_ai/*, .github/*"
          export_path="${OUT_DIR}/${APP_NAME}.ipa"

          [preset.0.options]
          application/app_store_team_id="${IOS_TEAM:-AAAAAAAAAA}"
          application/short_version="${APP_VERSION}"
          application/version="${APP_BUILD}"
          application/bundle_identifier="com.sekiph82.scrubbots"
          application/export_project_only=true
          icons/app_store_1024x1024="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/icon_1024x1024="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/iphone_120x120="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/iphone_180x180="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_76x76="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_152x152="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_167x167="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/spotlight_40x40="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/spotlight_80x80="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/settings_58x58="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/settings_87x87="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/notification_40x40="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/notification_60x60="res://assets/ui/final/branding/app_icon_ios_1024.png"
          CFG

      - name: Godot import (fail-closed)
        run: |
          mkdir -p out
          set +e
          "$GODOT" --headless --import > out/import.log 2>&1
          ec=$?
          set -e
          echo "import exit code: $ec"
          # Genuine failed imports / broken resources / script errors. WARNING lines are not matched.
          # The ScrubbotsNotify GDExtension (input local_notifications) has only an iOS library, so its load error on macOS is expected.
          if grep -nE "Error loading|Error importing|ERR_FILE_CORRUPT|SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Resource file not found" out/import.log | grep -v scrubbots_notify; then
            echo "::error::Godot import reported failed / corrupt resources (see out/import.log)"
            exit 1
          fi
          [ "$ec" -eq 0 ] || { echo "::error::Godot import exited $ec"; exit 1; }
          echo "IMPORT_GATE PASS: exit 0, zero failed-import / corrupt / script-error lines" | tee out/import_gate.txt
          grep -c "^ERROR" out/import.log | sed 's/^/total ERROR-prefixed lines (all printed below): /'
          grep "^ERROR" out/import.log || true

      - name: Godot export (Xcode projesi)
        run: |
          mkdir -p "$OUT_DIR"
          "$GODOT" --headless --export-release "iOS" "${OUT_DIR}/${APP_NAME}.ipa" > out/export.log 2>&1 \
            || { grep -iE "error|fail|invalid|missing" out/export.log | tail -25 | sed 's/^/::error::/'; exit 1; }
          if grep -nE "Error loading|ERR_FILE_CORRUPT|SCRIPT ERROR|Failed loading resource" out/export.log; then
            echo "::error::export reported failed resources"; exit 1
          fi
          ls -la "$OUT_DIR"

      - name: Xcode build (debug imzasiz / release dagitim imzali; no upload)
        run: |
          cd "$OUT_DIR"
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          rm -f "${APP_NAME}.ipa"   # Godot's project-only export path; the built IPA replaces it
          if [ "$BUILD_TYPE" = release ]; then
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -archivePath dd/app.xcarchive \
              DEVELOPMENT_TEAM="$IOS_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" archive | tail -40
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${IOS_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.sekiph82.scrubbots</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath dd/app.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath dd/export | tail -20
            mv dd/export/*.ipa "${APP_NAME}.ipa"
          else
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
            mkdir -p Payload
            cp -R dd/Build/Products/Release-iphoneos/*.app Payload/
            zip -qry "${APP_NAME}.ipa" Payload
          fi
          test -s "${APP_NAME}.ipa"
          mv "${APP_NAME}.ipa" "${ARTIFACT}.ipa"   # versioned name only after the build

      - name: IPA inventory + scan of the PCK inside the IPA
        run: |
          IPA="${OUT_DIR}/${ARTIFACT}.ipa"
          shasum -a 256 "$IPA" | tee out/ipa_sha256.txt
          stat -f '%N %z bytes' "$IPA" | tee out/ipa_size.txt
          unzip -Z1 "$IPA" > out/ipa_entries.txt
          wc -l < out/ipa_entries.txt | sed 's/^/ipa entries: /'
          PCK_IN_IPA=$(grep -E '^Payload/[^/]+\.app/[^/]+\.pck$' out/ipa_entries.txt | head -1)
          echo "pck inside IPA: $PCK_IN_IPA"
          test -n "$PCK_IN_IPA"
          mkdir -p "$RUNNER_TEMP/ipa_x" && unzip -q -o "$IPA" "$PCK_IN_IPA" -d "$RUNNER_TEMP/ipa_x"
          PCK="$RUNNER_TEMP/ipa_x/$PCK_IN_IPA"
          shasum -a 256 "$PCK" | tee -a out/ipa_sha256.txt
          echo "PCK=$PCK" >> "$GITHUB_ENV"
          # Every res:// file literal referenced by shipping scripts / scenes / data / addons / project
          # settings that exists in this workspace must be packaged (editor-only plugin.cfg excluded).
          grep -rhoE 'res://[A-Za-z0-9_./-]+\.[A-Za-z0-9]+' scripts scenes data addons project.godot default_bus_layout.tres 2>/dev/null \
            | sort -u | grep -v '/plugin\.cfg$' | while read -r p; do if [ -f "${p#res://}" ]; then echo "$p"; fi; done > out/required_runtime_paths.txt
          wc -l < out/required_runtime_paths.txt | sed 's/^/required runtime paths: /'
          grep -c 'res://scripts/ui/components/touch_scroll.gd' out/required_runtime_paths.txt | sed 's/^/TouchScroll helper required: /'
          cp -r .github/android/pck_probe "$RUNNER_TEMP/pck_probe"
          "$GODOT" --headless --path "$RUNNER_TEMP/pck_probe" -s res://pck_scan.gd -- \
            "$PCK" "$PWD/.github/android/family_first10_export_exclusions.txt" \
            "$PWD/out/required_runtime_paths.txt" "$PWD/out/ipa_pck_scan_report.json" 2>&1 | tee out/ipa_pck_scan.log
          grep -q "verdict=PASS" out/ipa_pck_scan.log

      - name: Headless boot of the IPA's pack (offline)
        run: |
          mkdir -p "$RUNNER_TEMP/boot" && cd "$RUNNER_TEMP/boot"
          "$GODOT" --headless --main-pack "$PCK" --quit-after 600 > "$GITHUB_WORKSPACE/out/boot.log" 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          tail -15 out/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|Resource file not found|Failed to load script|Error loading" out/boot.log | grep -v scrubbots_notify; then
            echo "::error::IPA pack boot reported missing / broken resources"; exit 1
          fi
          {
            echo "## ${ARTIFACT}.ipa (${BUILD_TYPE}: $([ "$BUILD_TYPE" = release ] && echo distribution-signed || echo unsigned))"
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo '```'; cat out/import_gate.txt out/ipa_size.txt out/ipa_sha256.txt; grep -h "PCK_SCAN" out/ipa_pck_scan.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}.ipa
          path: ${{ env.OUT_DIR }}/${{ env.ARTIFACT }}.ipa

      - name: Upload import log + IPA scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScrubBots-iOS-${{ inputs.build_type }}-ipa-inspection
          path: out/
          retention-days: 30

      - name: Remove the release keychain
        if: ${{ always() && inputs.build_type == 'release' }}
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
