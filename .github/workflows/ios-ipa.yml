name: iOS IPA

# Actions sekmesinden "Run workflow" ile elle calistirilir.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  APP_NAME: Scrubbots

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot + export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL" && unzip -q tpl.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$TPL/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      # export_presets.cfg repoda gitignore'da; CI icin burada uretiliyor.
      # Imza yok: xtool install telefona yuklerken kendi hesabinla imzaliyor.
      - name: iOS export preset
        run: |
          cat > export_presets.cfg <<CFG
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          ; Gelistirme/denetim dosyalari oyuna girmesin (coordination 1.7 GB)
          exclude_filter="coordination/*, docs/*, tests/*, tools/*, level_factory/*, content_pipeline/*, assets/art/references/*, assets/ui/generated/*, assets/ui/candidates/*"
          export_path="build/ios/${APP_NAME}.ipa"

          [preset.0.options]
          application/app_store_team_id="AAAAAAAAAA"
          application/bundle_identifier="com.sekiph82.scrubbots"
          application/export_project_only=true
          icons/app_store_1024x1024="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/icon_1024x1024="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/iphone_120x120="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/iphone_180x180="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_76x76="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_152x152="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/ipad_167x167="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/spotlight_40x40="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/spotlight_80x80="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/settings_58x58="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/settings_87x87="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/notification_40x40="res://assets/ui/final/branding/app_icon_ios_1024.png"
          icons/notification_60x60="res://assets/ui/final/branding/app_icon_ios_1024.png"
          CFG

      - name: Godot export (Xcode projesi)
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --import || true
          "$GODOT" --headless --export-release "iOS" "build/ios/${APP_NAME}.ipa" > export.log 2>&1 \
            || { grep -iE "error|fail|invalid|missing" export.log | tail -25 | sed 's/^/::error::/'; exit 1; }
          ls -la build/ios

      - name: Xcode build (imzasiz)
        run: |
          cd build/ios
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/${APP_NAME}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
