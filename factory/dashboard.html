<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrubBots Factory</title>
<style>
  :root { --bg:#16181f; --col:#1f2230; --card:#2a2e3f; --fg:#e6e8ef; --dim:#8a90a6;
          --pass:#3fb37f; --chg:#e0a83a; --pend:#5a6078; --esc:#e5534b; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:baseline; }
  header small { color:var(--dim); }
  #board { display:grid; grid-template-columns:repeat(6, minmax(160px,1fr)); gap:10px; padding:0 16px 16px; overflow-x:auto; }
  .col { background:var(--col); border-radius:8px; padding:8px; min-height:120px; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:2px 4px 8px; }
  .card { background:var(--card); border-radius:6px; padding:8px; margin-bottom:8px; cursor:pointer; border-left:4px solid transparent; }
  .card.esc { border-left-color:var(--esc); }
  .card .id { font-weight:600; }
  .card .task { color:var(--dim); font-size:12px; margin:2px 0 6px; word-break:break-word; }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; margin-right:4px; background:var(--pend); }
  .chip.PASS { background:var(--pass); } .chip.CHANGES { background:var(--chg); color:#000; }
  #detail { padding:0 16px 24px; }
  #detail a { color:#8ab4ff; margin-right:10px; cursor:pointer; }
  #questions { margin:0 16px 12px; }
  .q { background:var(--card); border-left:4px solid var(--esc); border-radius:6px; padding:8px; margin-bottom:8px; }
  .q.done { border-left-color:var(--pass); opacity:.7; }
  .q textarea { width:100%; box-sizing:border-box; margin-top:6px; background:var(--bg); color:var(--fg); border:1px solid var(--pend); border-radius:4px; font:inherit; min-height:48px; }
  .q button { margin-top:4px; background:var(--pass); color:#fff; border:0; border-radius:4px; padding:4px 12px; cursor:pointer; }
  pre { white-space:pre-wrap; background:var(--col); padding:12px; border-radius:6px; }
  @media (max-width:700px) { #board { grid-template-columns:repeat(6, 200px); } }
</style>
</head>
<body>
<header><strong>ScrubBots Factory</strong><small id="ts">loading…</small></header>
<section id="questions"></section>
<div id="board"></div>
<div id="detail"></div>
<script>
const STAGES = ["spec","build","review","approve","merged","escalated"];
let open = null;

// http.server directory listing → child names (folders keep their trailing "/")
async function list(path) {
  const r = await fetch(path, {cache:"no-store"});
  if (!r.ok) return [];
  const html = await r.text();
  return [...html.matchAll(/href="([^"?]+)"/g)].map(m => decodeURIComponent(m[1]));
}

async function refresh() {
  const dirs = (await list("jobs/")).filter(n => n.endsWith("/"));
  const jobs = [];
  for (const d of dirs) {
    try {
      const r = await fetch("jobs/" + d + "job.json", {cache:"no-store"});
      if (r.ok) jobs.push(await r.json());
    } catch (e) {}
  }
  const board = document.getElementById("board");
  board.innerHTML = STAGES.map(s => `<div class="col"><h2>${s}</h2>${
    jobs.filter(j => j.stage === s).map(j => `
      <div class="card ${s === "escalated" ? "esc" : ""}" data-id="${j.id}">
        <div class="id">${j.id}</div>
        <div class="task">${j.task}${j.round ? " · round " + j.round : ""}</div>
        ${Object.entries(j.reviews || {}).map(([k, v]) => `<span class="chip ${v || ""}">${k}</span>`).join("")}
      </div>`).join("")}</div>`).join("");
  board.querySelectorAll(".card").forEach(c => c.onclick = () => { open = c.dataset.id; showFiles(); });
  document.getElementById("ts").textContent = jobs.length + " jobs · " + new Date().toLocaleTimeString();
}

async function showFiles(file) {
  const base = "jobs/" + open + "/";
  let files = [];
  for (const n of await list(base)) {
    if (n.endsWith("/")) files.push(...(await list(base + n)).filter(f => !f.endsWith("/")).map(f => n + f));
    else files.push(n);
  }
  let body = "";
  if (file) body = (await (await fetch(base + file, {cache:"no-store"})).text()).replace(/[&<]/g, c => c === "&" ? "&amp;" : "&lt;");
  const d = document.getElementById("detail");
  d.innerHTML = `<h3>${open}</h3>${files.map(f => `<a data-f="${f}">${f}</a>`).join("")}${file ? `<pre>${body}</pre>` : ""}`;
  d.querySelectorAll("a").forEach(a => a.onclick = () => showFiles(a.dataset.f));
}

// Owner questions: redraw only when the set changes, so typing is never wiped
let qKey = "";
async function refreshQuestions() {
  let data;
  try { data = await (await fetch("/questions", {cache:"no-store"})).json(); } catch (e) { return; }
  const key = JSON.stringify(data);
  if (key === qKey) return;
  qKey = key;
  const box = document.getElementById("questions");
  if (!data.questions.length) { box.innerHTML = ""; return; }
  const esc = s => s.replace(/[&<"]/g, c => ({"&":"&amp;","<":"&lt;",'"':"&quot;"})[c]);
  box.innerHTML = `<h3>Questions for Şekip (${data.questions.length})</h3>` + data.questions.map((q, i) => {
    const answered = data.answers.includes("Q: " + q.split(/\s+/).join(" "));
    return `<div class="q ${answered ? "done" : ""}"><div>${esc(q)}</div>${answered
      ? "<small>Answered — the loop will apply it in the next job.</small>"
      : `<textarea id="a${i}" placeholder="Your answer"></textarea><button data-i="${i}">Send</button>`}</div>`;
  }).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = async () => {
    const answer = document.getElementById("a" + b.dataset.i).value.trim();
    if (!answer) return;
    b.disabled = true;
    const r = await fetch("/answer", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question: data.questions[b.dataset.i], answer})});
    if (!r.ok) { b.disabled = false; alert("Save failed: " + r.status); return; }
    qKey = ""; refreshQuestions();
  });
}

refresh();
refreshQuestions();
setInterval(refresh, 2000);
setInterval(refreshQuestions, 2000);
</script>
</body>
</html>
